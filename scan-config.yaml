# ============================================================================
# auto-code-scanning: this repository's own config, and the reference copy.
# Consumers generate theirs with scripts/setup-scan-fix from
# templates/scan-config/<tier>.yaml. Every key below has a reader, except
# ci.required_checks (informational) and two keys the schema requires: schema_version,
# and fix_loop.claude_code_action_ref when the fix loop is enabled (a mirror of the
# workflow's pin).
# ============================================================================
schema_version: "1.0"

global:
  # Master switch for LOCAL pre-commit/pre-push scanning. Set false to skip local scanner
  # hooks (e.g. to avoid blocking in-progress work) WITHOUT uninstalling lefthook; CI is
  # unaffected. Default true; only an explicit false disables.
  local_hooks_enabled: true

# Not configured here:
# - severities, scanner arguments and hook stages: each hook and workflow sets its own
#   (auto-code-scanning docs/HOOK-REFERENCE.md and docs/REUSABLE-WORKFLOWS.md);
# - which local hooks run: your hook manifest and the file types decide;
# - tool versions: CI uses the scanner versions pinned in the auto-code-scanning release
#   you call, and local hooks run whatever is on PATH (auto-code-scanning docs/VERSION-PINNING.md).
#
# `enabled` selects the languages hosted Semgrep scans (csharp, typescript) and the C#
# on-demand scan, and tells setup verification what to check. A non-empty `languages`
# input on the calling workflow overrides it for hosted Semgrep. It does not switch
# local hooks on or off.
languages:
  terraform:
    enabled: true

  csharp:
    enabled: false
    build: { solution: "", working_dir: "." } # solution is relative to working_dir

  typescript:
    enabled: false
    build: { working_dir: "." }

  sql:
    enabled: false

ci:
  # Used when the app-code workflow detects languages from this file.
  sarif: { category_prefix: "scan-" }

  # Informational branch-protection check names from this repository's ci.yml.
  # Reusable workflow callers must use the check names emitted by their own jobs.
  required_checks:
    - Lint & Validate
    - Test Scripts
    - Test Hooks (aws)
    - Test Hooks (azure)
    - Test Hooks (gcp)
    - Test Gitleaks hook
    - Integration Test
    - Performance Check

suppressions:
  # Expiry limits and approval rules live in this registry's own `settings` block.
  file: ".scan-suppressions.yaml"

# ============================================================================
# FIX LOOP (LAYER B — optional agentic autonomous fix)
# Drives .github/workflows/autonomous-fix.yml and the in-session .claude bundle.
# OFF by default. Turn on with `fix_loop.enabled: true` AND the `ai-autofix`
# label on a PR. See docs/FIX-LOOP.md and docs/SECURITY-MODEL.md.
# ============================================================================
fix_loop:
  enabled: false

  # Label applied when the loop needs human review
  human_review_label: "needs-human-review"  # applied on cap/gate/failure

  # Agent limits
  max_turns: 8        # claude-code-action --max-turns per analyze run
  max_iterations: 3   # hard cap on autofix commits per PR (.fix-attempts)

  # ALLOWLIST (not denylist): ONLY these paths may be auto-fixed. Anything
  # outside is gated to human review. Tune per consumer in scan-config.yaml.
  allowlist_paths:
    - "src/"
    - "tests/"
    - "app/"
    - "lib/"

  # GATED paths: security-sensitive areas that are NEVER auto-fixed even if they
  # fall inside an allowlist dir. Matched case-insensitively as substrings.
  gated_paths:
    - "auth"
    - "payment"
    - "crypto"
    - "security"
    - "identity"
    - "secret"
    - "credential"
    - ".github/"
    - ".claude/"
    - "hooks"
    - "lefthook.yml"
    - "scan-and-fix.ps1"
    - "scripts/"
    - ".env"
    - "LICENSE"

  # Mirror of the action pin in the reusable workflow; required when enabled,
  # but not read at run time. Consumers inherit the action from their platform release.
  claude_code_action_ref: "anthropics/claude-code-action@d5726de019ec4498aa667642bc3a80fca83aa102"  # v1.0.148

  # Authoritative re-verification command, run by the verify job. Derive from
  # languages.*.build (e.g. `dotnet build <solution>`). Empty = secret-scan only.
  # SECURITY: this is EXECUTED. It is read from the BASE ref (a PR can't change it) and
  # runs token-free, but it is still arbitrary CI code — keep it trusted. Best practice:
  # point it at a checked-in script under a gated path, e.g. "bash scripts/ci-build-verify.sh",
  # so it can't be altered in-PR without tripping the gate. See docs/SECURITY-MODEL.md §7.1.
  build_verify_cmd: ""
