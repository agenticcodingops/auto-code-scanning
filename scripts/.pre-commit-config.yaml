# Standard Template - Recommended hooks (Days 31-60)
# + linting + critical security. Target: 50%+ developer adoption.
# Copy this to your repo as .pre-commit-config.yaml
#
# Adds to starter: terraform_validate, terraform_tflint, trivy-iac-critical
# Note: no-commit-to-branch removed (branch protection is a workflow
#       preference, not a security concern)
---
minimum_pre_commit_version: "3.2.0"
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: 3e8a8703264a2f4a69428a0aa4dcb512790b2c8c  # v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-json
      - id: detect-private-key

  - repo: https://github.com/antonbabenko/pre-commit-terraform
    rev: 4c4437d784e93cacb1f05f1d7bc28e4354fafd20  # v1.109.4
    hooks:
      - id: terraform_fmt
      - id: terraform_validate

  - repo: https://github.com/agenticcodingops/auto-code-scanning
    rev: v3.1.2  # x-release-please-version
    hooks:
      - id: tflint
        stages: [pre-push]
      - id: trivy-secrets
        stages: [pre-commit]
      - id: gitleaks
        stages: [pre-commit]
      - id: trivy-iac-critical
        stages: [pre-commit]
      # ---------------------------------------------------------------
      # OPTIONAL: Snyk IaC - requires Snyk license and SNYK_TOKEN
      # To enable: npm install -g snyk && snyk auth
      # Uncomment below. Hook exits 0 (fail-open) if not configured.
      # ---------------------------------------------------------------
      # - id: snyk-iac
      #   stages: [pre-push]
