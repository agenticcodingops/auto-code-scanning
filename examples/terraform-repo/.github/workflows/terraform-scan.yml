# Example copy of templates/workflows/terraform-scan.yml as shipped in v3.1.2.
# In your repository, pin the full commit SHA of the release instead of the tag:
#   uses: agenticcodingops/auto-code-scanning/.github/workflows/reusable-scan.yml@179f7e83fb8845aac3fc0f7c01ac0d129e4dfa00  # v3.1.2
#   scanning-repo-ref: "179f7e83fb8845aac3fc0f7c01ac0d129e4dfa00"  # v3.1.2
# ============================================================================
# terraform-scan.yml — CALLER (drop into a consumer repo: .github/workflows/)
# Thin caller for the reusable TERRAFORM/IaC scanner. Pin the tag — never @main.
# ============================================================================
name: Terraform Security Scan

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  security-events: write
  pull-requests: write

jobs:
  terraform-scan:
    uses: agenticcodingops/auto-code-scanning/.github/workflows/reusable-scan.yml@v3.1.2  # x-release-please-version
    with:
      terraform-directory: "."
      cloud-provider: "aws"        # aws | azure | gcp
      severity: "CRITICAL,HIGH"
      scanning-repo-ref: "v3.1.2"  # x-release-please-version
    # Optional Snyk IaC (needs SNYK_TOKEN secret):
    # secrets:
    #   SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
