comment_severity_threshold: "MEDIUM"
ignore_patterns:
  - "package-lock.json"
  - "pnpm-lock.yaml"
  - "yarn.lock"
  - "poetry.lock"
  - "vendor/**"
  - "dist/**"
  - "build/**"
  - ".terraform/**"
  - "*.tfstate"
  - "*.tfstate.backup"
  - "*.min.js"
  - "*.min.css"
  - "*.map"
  - "__pycache__/**"
  - ".pytest_cache/**"
  - "*.pyc"
  - ".scanning/**"
  - "logs/**"
