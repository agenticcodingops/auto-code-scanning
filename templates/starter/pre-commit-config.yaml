# Starter Template - Minimal friction (Days 1-30)
# Secrets + formatting only. Target: 3-5 advocate developers.
# Copy this to your repo as .pre-commit-config.yaml
#
# Hooks: trailing-whitespace, end-of-file-fixer, check-yaml,
#         detect-private-key, terraform_fmt, trivy-secrets
---
minimum_pre_commit_version: "3.2.0"
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: 3e8a8703264a2f4a69428a0aa4dcb512790b2c8c  # v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: detect-private-key

  - repo: https://github.com/antonbabenko/pre-commit-terraform
    rev: 4c4437d784e93cacb1f05f1d7bc28e4354fafd20  # v1.109.4
    hooks:
      - id: terraform_fmt

  - repo: https://github.com/agenticcodingops/auto-code-scanning
    rev: v3.1.2  # x-release-please-version
    hooks:
      - id: trivy-secrets
        stages: [pre-commit]
