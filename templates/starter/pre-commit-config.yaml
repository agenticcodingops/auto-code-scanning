# Starter Template - Minimal friction (Days 1-30)
# Secrets + formatting only. Target: 3-5 advocate developers.
# Copy this to your repo as .pre-commit-config.yaml
#
# Hooks: trailing-whitespace, end-of-file-fixer, check-yaml,
#         detect-private-key, terraform_fmt, trivy-secrets
---
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: c4a0b883114b00d8d76b479c820ce7950211c99b  # v4.5.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: detect-private-key

  - repo: https://github.com/antonbabenko/pre-commit-terraform
    rev: 4bf25029a7a45d7d69592250dd3c327a74d77631  # v1.88.0
    hooks:
      - id: terraform_fmt

  - repo: https://github.com/agenticcodingops/auto-code-scanning
    rev: v3.0.2  # x-release-please-version
    hooks:
      - id: trivy-secrets
        stages: [pre-commit]
