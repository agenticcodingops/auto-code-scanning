# AWS Full Template
# Complete security scanning for AWS Terraform repositories.
# Copy this to your repo as .pre-commit-config.yaml
#
# This template includes all hooks at the strict tier level,
# configured specifically for AWS cloud provider.
---
minimum_pre_commit_version: "3.2.0"
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: 3e8a8703264a2f4a69428a0aa4dcb512790b2c8c  # v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-json
      - id: check-added-large-files
        args: ["--maxkb=500"]
      - id: check-merge-conflict
      - id: detect-private-key

  - repo: https://github.com/antonbabenko/pre-commit-terraform
    rev: 4c4437d784e93cacb1f05f1d7bc28e4354fafd20  # v1.109.4
    hooks:
      - id: terraform_fmt
      - id: terraform_validate
      - id: terraform_docs

  - repo: https://github.com/agenticcodingops/auto-code-scanning
    rev: v3.1.2  # x-release-please-version
    hooks:
      # Fast checks at pre-commit
      - id: trivy-iac-critical
        stages: [pre-commit]
      - id: trivy-secrets
        stages: [pre-commit]
      - id: gitleaks
        stages: [pre-commit]
      - id: validate-suppressions
        stages: [pre-commit]
      # Full checks at pre-push
      - id: trivy-iac-full
        stages: [pre-push]
      - id: checkov
        stages: [pre-push]
      - id: tflint
        stages: [pre-push]
      # ---------------------------------------------------------------
      # OPTIONAL: Snyk IaC - requires Snyk license and SNYK_TOKEN
      # To enable: npm install -g snyk && snyk auth
      # Uncomment below. Hook exits 0 (fail-open) if not configured.
      # ---------------------------------------------------------------
      # - id: snyk-iac
      #   stages: [pre-push]
