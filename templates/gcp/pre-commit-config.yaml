# GCP Full Template
# Complete security scanning for GCP Terraform repositories.
# Copy this to your repo as .pre-commit-config.yaml
#
# This template includes all hooks at the strict tier level,
# configured specifically for GCP cloud provider.
---
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: c4a0b883114b00d8d76b479c820ce7950211c99b  # v4.5.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-json
      - id: check-added-large-files
        args: ["--maxkb=500"]
      - id: check-merge-conflict
      - id: detect-private-key

  - repo: https://github.com/antonbabenko/pre-commit-terraform
    rev: 4bf25029a7a45d7d69592250dd3c327a74d77631  # v1.88.0
    hooks:
      - id: terraform_fmt
      - id: terraform_validate
      - id: terraform_docs

  - repo: https://github.com/agenticcodingops/auto-code-scanning
    rev: v3.0.9  # x-release-please-version
    hooks:
      # Fast checks at pre-commit
      - id: trivy-iac-critical
        stages: [pre-commit]
      - id: trivy-secrets
        stages: [pre-commit]
      - id: gitleaks
        stages: [pre-commit]
      - id: validate-suppressions
        stages: [pre-commit]
      # Full checks at pre-push
      - id: trivy-iac-full
        stages: [pre-push]
      - id: checkov
        stages: [pre-push]
      - id: tflint
        stages: [pre-push]
      # ---------------------------------------------------------------
      # OPTIONAL: Snyk IaC - requires Snyk license and SNYK_TOKEN
      # To enable: npm install -g snyk && snyk auth
      # Uncomment below. Hook exits 0 (fail-open) if not configured.
      # ---------------------------------------------------------------
      # - id: snyk-iac
      #   stages: [pre-push]
