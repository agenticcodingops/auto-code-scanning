# Strict Template - Full enforcement (Days 61-90)
# All tools, all stages. Target: 90%+ adoption, <5% bypass rate.
# Copy this to your repo as .pre-commit-config.yaml
#
# Adds to standard: terraform_docs, trivy-iac-full (pre-push),
#                    checkov-strict (pre-push), validate-suppressions
---
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: c4a0b883114b00d8d76b479c820ce7950211c99b  # v4.5.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-json
      - id: check-added-large-files
        args: ["--maxkb=500"]
      - id: check-merge-conflict
      - id: detect-private-key

  - repo: https://github.com/antonbabenko/pre-commit-terraform
    rev: 4bf25029a7a45d7d69592250dd3c327a74d77631  # v1.88.0
    hooks:
      - id: terraform_fmt
      - id: terraform_validate
      - id: terraform_docs

  - repo: https://github.com/agenticcodingops/auto-code-scanning
    rev: ba441c69afa2d287893667cbe81b1298fd698e16  # v2.3.6 # x-release-please-version
    hooks:
      - id: tflint
        stages: [pre-push]
      - id: trivy-secrets
        stages: [pre-commit]
      - id: gitleaks
        stages: [pre-commit]
      - id: trivy-iac-critical
        stages: [pre-commit]
      - id: trivy-iac-full
        stages: [pre-push]
      - id: checkov-strict
        stages: [pre-push]
      - id: validate-suppressions
        stages: [pre-commit]
      # ---------------------------------------------------------------
      # OPTIONAL: Snyk IaC - requires Snyk license and SNYK_TOKEN
      # To enable: npm install -g snyk && snyk auth
      # Uncomment below. Hook exits 0 (fail-open) if not configured.
      # ---------------------------------------------------------------
      # - id: snyk-iac
      #   stages: [pre-push]

  # -----------------------------------------------------------------------
  # OPTIONAL: Commitizen - Conventional commit message enforcement
  # Uncomment below to enable. This enforces commit message format
  # (feat:, fix:, etc.) which is a team workflow preference, not a
  # security concern. Only enable if your team uses conventional commits.
  # -----------------------------------------------------------------------
  # - repo: https://github.com/commitizen-tools/commitizen
  #   rev: a3498aba5e94c9f7c4acb529b5e7eb6df65fd053  # v3.29.1
  #   hooks:
  #     - id: commitizen
  #       stages: [commit-msg]
