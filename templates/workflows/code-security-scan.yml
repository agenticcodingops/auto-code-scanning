# ============================================================================
# code-security-scan.yml — CALLER (drop into a consumer repo: .github/workflows/)
# Thin caller for the reusable APP-CODE scanner. Pin the tag — never @main.
# ============================================================================
name: Code Security Scan

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  security-events: write   # upload SARIF to code scanning
  pull-requests: write     # PR annotations

jobs:
  code-scan:
    uses: agenticcodingops/auto-code-scanning/.github/workflows/code-security-scan.yml@67e81a9260c98b734db9547f25c65d92a5de0f92  # v2.3.6 # x-release-please-version
    with:
      # Omit `languages` to auto-detect from scan-config.yaml, or pin explicitly:
      # languages: "csharp,typescript"
      category-prefix: "scan-"
      fail-on-findings: true
