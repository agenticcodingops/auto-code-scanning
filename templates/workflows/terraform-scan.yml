# ============================================================================
# terraform-scan.yml — CALLER (drop into a consumer repo: .github/workflows/)
# Thin caller for the reusable TERRAFORM/IaC scanner. Pin the tag — never @main.
# ============================================================================
name: Terraform Security Scan

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  security-events: write
  pull-requests: write

jobs:
  terraform-scan:
    uses: agenticcodingops/auto-code-scanning/.github/workflows/reusable-scan.yml@c6e053f8e09c7d06a60745a51c6bb32f08cd74fc  # v2.3.6 # x-release-please-version
    with:
      terraform-directory: "."
      cloud-provider: "aws"        # aws | azure | gcp
      severity: "CRITICAL,HIGH"
      scanning-repo-ref: "c6e053f8e09c7d06a60745a51c6bb32f08cd74fc"  # v2.3.6 # x-release-please-version
    # Optional Snyk IaC (needs SNYK_TOKEN secret):
    # secrets:
    #   SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
