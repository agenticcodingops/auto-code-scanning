# ============================================================================
# autonomous-fix.yml — CALLER (drop this into a consumer repo: .github/workflows/)
#
# Thin caller for the reusable agentic fix-loop. This file owns the PRIVILEGE
# BOUNDARY (who/when); all the hardened two-job logic lives in the reusable
# workflow it `uses:` at a PINNED tag. See docs/FIX-LOOP.md + docs/SECURITY-MODEL.md.
#
# Setup (once):
#   - add `ai-autofix` + `needs-human-review` labels (setup-scanning does this)
#   - add secrets AUTOFIX_TOKEN (fine-grained PAT) + ANTHROPIC_API_KEY
#   - set fix_loop.enabled: true in scan-config.yaml
#
# Opt a PR in by adding the `ai-autofix` label, then a trusted review triggers a fix.
# ============================================================================

name: Autonomous Fix (caller)

on:
  pull_request_review:
    types: [submitted]
  pull_request_review_comment:
    types: [created]
  workflow_dispatch:
    inputs:
      pr_number:
        description: "PR number to run the fix-loop against (maintainer-only)."
        required: true
        type: string

# Grant permissions only to the job that calls the reusable workflow.
permissions: {}

jobs:
  fix:
    # This is the ceiling for the reusable workflow's job-specific permissions.
    # Branch pushes still use AUTOFIX_TOKEN, not the workflow token.
    permissions:
      contents: read
      actions: read
      pull-requests: write
      issues: write
    # PRIVILEGE BOUNDARY — only run when ALL hold:
    #   * manual dispatch by a person or a specific GitHub App, OR
    #   * non-fork PR head in THIS repo, AND
    #   * the PR carries the `ai-autofix` label, AND
    #   * the trigger came from a trusted GitHub App OR an OWNER/MEMBER/COLLABORATOR.
    #
    # Trusted bots are GitHub App accounts: an `<app>[bot]` login belongs to one App.
    # Never add github-actions[bot]: every workflow's GITHUB_TOKEN acts as that login,
    # so it names no particular workflow (the reusable workflow refuses it too). To let
    # your own review workflow start the loop, have it post with its own GitHub App's
    # token and add that App's `<app>[bot]` login to both lists below.
    if: >-
      (
        github.event_name == 'workflow_dispatch' &&
        github.actor != 'github-actions[bot]' &&
        github.triggering_actor != 'github-actions[bot]'
      ) ||
      (
        github.event.pull_request.head.repo.full_name == github.repository &&
        contains(github.event.pull_request.labels.*.name, 'ai-autofix') &&
        (
          contains(fromJSON('["coderabbitai[bot]","sonarqubecloud[bot]","sonarcloud[bot]"]'), github.event.review.user.login) ||
          contains(fromJSON('["coderabbitai[bot]","sonarqubecloud[bot]","sonarcloud[bot]"]'), github.event.comment.user.login) ||
          contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.review.author_association) ||
          contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association)
        )
      )
    # PIN to a release tag (or SHA) — NEVER @main. Bump deliberately.
    uses: agenticcodingops/auto-code-scanning/.github/workflows/autonomous-fix.yml@v3.1.0  # x-release-please-version
    with:
      pr_number: ${{ github.event.pull_request.number || github.event.inputs.pr_number }}
      config_path: scan-config.yaml
      scanning_repo_ref: v3.1.0  # x-release-please-version
    # Pass only the three secrets the reusable workflow declares, never
    # `secrets: inherit` (that hands it every secret of the repository and org).
    secrets:
      AUTOFIX_TOKEN: ${{ secrets.AUTOFIX_TOKEN }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
