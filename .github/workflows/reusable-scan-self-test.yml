# ============================================================================
# REUSABLE SCAN SELF-TEST
# auto-code-scanning
#
# Runs this repository's own reusable-scan.yml, with the configs from the same
# commit, against the Azure test fixture. A change to the scanner pins or to a
# cloud config is therefore exercised before it is released, and the run log
# records the exact scanner versions (the Checkov image tag and banner,
# `trivy --version`, `tflint --version`).
#
# The fixture carries findings, so the gate is not asserted. The verify job
# fails instead when a scanner wrote no report or TFLint reported an error:
# the ways the scan has failed silently before.
#
# release-verify.yml calls this workflow for every published release, so each
# release tag has a run of its own that records the versions it installs.
# ============================================================================

name: Reusable Scan Self-Test

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/reusable-scan.yml"
      - ".github/workflows/reusable-scan-self-test.yml"
      - "configs/**"
      - "tests/fixtures/terraform-valid/**"
      - "tests/fixtures/checkov-consumer-inputs/**"
      - "scripts/checkov-consumer-options.py"
  push:
    branches: [main]
    paths:
      - ".github/workflows/reusable-scan.yml"
      - ".github/workflows/reusable-scan-self-test.yml"
      - "configs/**"
      - "tests/fixtures/terraform-valid/**"
      - "tests/fixtures/checkov-consumer-inputs/**"
      - "scripts/checkov-consumer-options.py"
  workflow_dispatch:
  # Called by release-verify.yml on each release tag.
  workflow_call:

permissions:
  contents: read

jobs:
  checkov-consumer-inputs:
    name: Verify Checkov consumer inputs and inline skips
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout fixtures and helper
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2

      - name: Install YAML reader
        run: python3 -m pip install --disable-pip-version-check PyYAML==6.0.3

      - name: Stage fixture outside the configured tests exclusion
        run: cp -R tests/fixtures/checkov-consumer-inputs .checkov-consumer-fixture

      - name: Prepare both consumer inputs
        id: options
        env:
          CHECKOV_SKIP_CHECKS: CKV_AZURE_33,CKV_AZURE_33
          CHECKOV_RENDER_ITER_COUNT: "20"
        run: python3 scripts/checkov-consumer-options.py prepare configs/azure/.checkov.yaml

      - name: Scan fixture at the default render limit
        uses: bridgecrewio/checkov-action@444c9db6fa75e2d9c19ebf1fde7322089be9009e  # v12.3125.0 = Checkov 3.3.19
        with:
          directory: .checkov-consumer-fixture
          config_file: configs/azure/.checkov.yaml
          framework: terraform
          output_format: cli,json
          output_file_path: console,default-consumer-results.json
          soft_fail: true
          download_external_modules: false

      - name: Scan local composition and inline skip fixture
        uses: bridgecrewio/checkov-action@444c9db6fa75e2d9c19ebf1fde7322089be9009e  # v12.3125.0 = Checkov 3.3.19
        env: ${{ fromJSON(steps.options.outputs.render-env) }}
        with:
          directory: .checkov-consumer-fixture
          config_file: configs/azure/.checkov.yaml
          skip_check: ${{ steps.options.outputs.skip-checks }}
          framework: terraform
          output_format: cli,json,sarif
          output_file_path: console,consumer-results.json,consumer-results.sarif
          soft_fail: true
          download_external_modules: false

      - name: Filter SARIF before verification
        run: python3 scripts/checkov-consumer-options.py filter-sarif consumer-results.sarif

      - name: Verify skips and rendered network rules
        run: |
          python3 << 'PYTHON_SCRIPT'
          import json

          with open("default-consumer-results.json") as stream:
              default_data = json.load(stream)
          default_reports = default_data if isinstance(default_data, list) else [default_data]
          default_failed = {check["check_id"] for report in default_reports
                            for check in report["results"]["failed_checks"]}
          assert {"CKV_AZURE_35", "CKV_AZURE_36"} <= default_failed, default_failed
          with open("consumer-results.json") as stream:
              data = json.load(stream)
          reports = data if isinstance(data, list) else [data]
          skipped = {check["check_id"] for report in reports
                     for check in report["results"]["skipped_checks"]}
          # Flag skips are excluded by the pinned scanner; inline skips are
          # recorded in skipped_checks. Both must be absent from uploaded SARIF.
          assert "CKV_AZURE_110" in skipped, skipped
          reported = {check["check_id"] for report in reports
                      for key in ("passed_checks", "failed_checks", "skipped_checks")
                      for check in report["results"][key]}
          assert "CKV_AZURE_33" not in reported, reported
          passed = {check["check_id"] for report in reports
                    for check in report["results"]["passed_checks"]}
          assert {"CKV_AZURE_35", "CKV_AZURE_36"} <= passed, passed
          failed = {check["check_id"] for report in reports
                    for check in report["results"]["failed_checks"]}
          assert not {"CKV_AZURE_35", "CKV_AZURE_36"} & failed, failed
          with open("consumer-results.sarif") as stream:
              sarif = json.load(stream)
          results = [result for run in sarif["runs"] for result in run.get("results", [])]
          assert results, "Fixture must retain genuine failures"
          assert not any(result.get("suppressions") for result in results)
          assert not {"CKV_AZURE_33", "CKV_AZURE_110"} & {r["ruleId"] for r in results}
          print("Consumer and inline skips removed; rendered storage network rules passed")
          PYTHON_SCRIPT

  scan:
    # reusable-scan.yml declares these on its SARIF and PR-comment jobs, and a caller
    # must grant them even though both jobs are switched off below.
    permissions:
      contents: read
      security-events: write
      pull-requests: write
    uses: ./.github/workflows/reusable-scan.yml
    with:
      terraform-directory: tests/fixtures/terraform-valid/azure
      cloud-provider: azure
      scanning-repo-ref: ${{ github.sha }}
      fail-on-findings: false
      upload-sarif: false
      post-pr-comment: false
      upload-metrics: false

  verify:
    name: Verify every scanner wrote a report
    needs: scan
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Download scan results
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4.3.0
        with:
          path: scan-artifacts/

      - name: Check the reports
        run: |
          python3 << 'PYTHON_SCRIPT'
          import json
          import os
          import sys

          problems = []
          rows = []  # (report, result) for the job summary

          def load(path):
              try:
                  with open(path) as fh:
                      return json.load(fh)
              except (OSError, ValueError) as exc:
                  problems.append(f"{path}: {exc}")
                  return None

          # Checkov writes its report only when it runs; the report names its version.
          checkov = load("scan-artifacts/checkov-results/checkov-results.json")
          if checkov is not None:
              reports = checkov if isinstance(checkov, list) else [checkov]
              versions = sorted({(r.get("summary") or r).get("checkov_version") or "unknown" for r in reports})
              print(f"Checkov report written by version {', '.join(versions)}")
              rows.append(("Checkov", f"written by Checkov {', '.join(versions)}"))
          else:
              rows.append(("Checkov", "missing or unreadable"))

          tflint = load("scan-artifacts/tflint-results/tflint-results.json")
          if tflint is not None:
              errors = tflint.get("errors") or []
              counts = f"{len(tflint.get('issues') or [])} issue(s), {len(errors)} error(s)"
              print(f"TFLint: {counts}")
              problems.extend(f"TFLint error: {err.get('message', err)}" for err in errors)
              rows.append(("TFLint", counts))
          else:
              rows.append(("TFLint", "missing or unreadable"))

          for name in ("trivy-iac-results.json", "trivy-secrets-results.json"):
              report = load(f"scan-artifacts/trivy-results/{name}")
              if report is None:
                  rows.append((f"Trivy `{name}`", "missing or unreadable"))
              elif "SchemaVersion" not in report:
                  problems.append(f"{name} is not a Trivy JSON report")
                  rows.append((f"Trivy `{name}`", "not a Trivy JSON report"))
              else:
                  rows.append((f"Trivy `{name}`", "Trivy JSON report"))

          for problem in problems:
              text = str(problem).replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A")
              print(f"::error::{text}")

          # The scan jobs write the versions they installed to their own summaries.
          summary = ["### Scanner reports", "", "| Report | Result |", "|---|---|"]
          summary += [f"| {report} | {result} |" for report, result in rows]
          summary += ["", "Trivy, TFLint and TFLint ruleset versions and the Trivy checks bundle digest:"
                      " see the Trivy IaC Scan and TFLint Scan job summaries."]
          if problems:
              summary += ["", "**Problems**", ""] + [f"- {problem}" for problem in problems]
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as fh:
              fh.write("\n".join(summary) + "\n")

          sys.exit(1 if problems else 0)
          PYTHON_SCRIPT
