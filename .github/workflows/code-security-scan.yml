# ============================================================================
# REUSABLE APP-CODE SECURITY SCAN (LAYER A)
# auto-code-scanning
#
# Companion to reusable-scan.yml (Terraform/IaC). This workflow scans application
# code (C#/.NET, TypeScript/JS) and uploads SARIF per tool under DISTINCT
# categories (post-2025-07 GitHub rule), driven by the consumer's scan-config.yaml.
#
# Usage in a consuming repo (pin to a release tag!):
#   jobs:
#     code-scan:
#       uses: {org}/auto-code-scanning/.github/workflows/code-security-scan.yml@<release tag>
#       with:
#         languages: "csharp,typescript"   # or omit to auto-detect from scan-config.yaml
#       permissions:
#         contents: read
#         actions: read
#         security-events: write
#         pull-requests: write
# Explicit caller permission ceilings must include actions: read, even without
# SARIF uploads. Private uploads also need it to read workflow-run metadata.
# ============================================================================

name: Reusable App-Code Security Scan

on:
  workflow_call:
    inputs:
      languages:
        description: "Comma-separated app-code languages to scan (csharp,typescript). Empty = auto-detect from scan-config.yaml."
        type: string
        required: false
        default: ""
      severity:
        description: "Semgrep severity filter passed through (ERROR,WARNING)."
        type: string
        required: false
        default: "ERROR"
      category-prefix:
        description: "SARIF category prefix; must match ci.sarif.category_prefix. Ensures distinct categories per tool."
        type: string
        required: false
        default: "scan-"
      semgrep-version:
        description: "Pinned Semgrep version (supply-chain hygiene)."
        type: string
        required: false
        default: "1.100.0"
      run-secret-scan:
        description: "Also run a Trivy secret scan on changed code."
        type: boolean
        required: false
        default: true
      fail-on-findings:
        description: "Fail the workflow when findings are present."
        type: boolean
        required: false
        default: true
      upload-sarif:
        description: "Upload SARIF to GitHub code scanning."
        type: boolean
        required: false
        default: true
    outputs:
      languages-scanned:
        description: "JSON array of languages that were scanned."
        value: ${{ jobs.detect.outputs.languages }}

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ==========================================================================
  # DETECT — derive the app-code languages from scan-config.yaml (or the input)
  # ==========================================================================
  detect:
    name: Detect languages
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      languages: ${{ steps.detect.outputs.languages }}
      category_prefix: ${{ steps.detect.outputs.category_prefix }}
      policy-helper-artifact: ${{ steps.helper-name.outputs.name }}
    steps:
      - name: Checkout calling repo
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          ref: ${{ github.event.pull_request.base.sha || github.sha }}
          persist-credentials: false

      - name: Select policy Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: '3.11'

      - name: Install policy reader
        run: python3 -I -m pip install --disable-pip-version-check PyYAML==6.0.3

      - name: Name workflow policy helper
        id: helper-name
        run: echo "name=app-policy-helper-$(python -I -c 'import uuid; print(uuid.uuid4().hex)')" >> "$GITHUB_OUTPUT"

      - name: Package workflow policy helper
        run: |
          cat > "$RUNNER_TEMP/prepare_scan_policy.py" <<'POLICY_HELPER'
          """Materialize scanner configuration from a trusted Git commit before scanning."""
          import os
          from pathlib import Path
          import re
          import subprocess
          
          POLICY_NAMES = {"scan-config.yaml", "trivy.yaml", "trivy.yml", ".trivyignore", ".trivyignore.yaml",
                          ".checkov.yaml", ".checkov.yml", ".tflint.hcl", ".snyk", ".semgrepignore",
                          ".semgrepignore2", ".gitignore", ".gitleaks.toml", "trivy-secret.yaml", "trivy-secret.yml"}
          
          
          def git(*arguments):
              return subprocess.run(["git", *arguments], check=True, capture_output=True).stdout
          
          
          def prepare(base, root="."):
              if not re.fullmatch(r"[0-9a-fA-F]{40,64}", base):
                  raise ValueError("A full trusted commit SHA is required")
              root = Path(root).resolve()
              git("cat-file", "-e", base + "^{commit}")
              trusted = {p.decode("utf-8") for p in git("ls-tree", "-r", "-z", "--name-only", base, "--").split(b"\0") if p}
              current = {p.decode("utf-8") for p in git("ls-files", "-z", "--").split(b"\0") if p}
              for name in sorted(current | trusted):
                  if Path(name).name not in POLICY_NAMES:
                      continue
                  target = root / name
                  # Parent symlinks must not redirect writes beyond the scanned checkout.
                  for parent in target.parents:
                      if parent == root:
                          break
                      if parent.is_symlink():
                          raise ValueError("Scanner policy parent must not be a symlink")
                  if target.is_symlink():
                      target.unlink()
                  if name in trusted:
                      mode = git("ls-tree", base, "--", name).split(b" ", 1)[0]
                      if mode != b"100644" and mode != b"100755":
                          raise ValueError("Scanner policy must be a regular file")
                      target.parent.mkdir(parents=True, exist_ok=True)
                      target.write_bytes(git("show", f"{base}:{name}", "--"))
                  elif target.exists():
                      target.unlink()
          
          
          if __name__ == "__main__":
              prepare(os.environ["TRUSTED_POLICY_SHA"])
          POLICY_HELPER

      - name: Upload workflow policy helper
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: ${{ steps.helper-name.outputs.name }}
          path: ${{ runner.temp }}/prepare_scan_policy.py
          retention-days: 1

      - name: Resolve enabled app-code languages
        id: detect
        env:
          INPUT_LANGUAGES: ${{ inputs.languages }}
          INPUT_PREFIX: ${{ inputs.category-prefix }}
        run: |
          python3 - <<'PY'
          import json, os
          app_langs = ["csharp", "typescript"]
          prefix = os.environ.get("INPUT_PREFIX") or "scan-"
          chosen = []
          forced = [s.strip() for s in os.environ.get("INPUT_LANGUAGES", "").split(",") if s.strip()]
          if forced:
              if any(l not in app_langs for l in forced):
                  raise ValueError("Unsupported language input")
              chosen = forced
          else:
              try:
                  import yaml
                  with open("scan-config.yaml", encoding="utf-8") as fh:
                      cfg = yaml.safe_load(fh) or {}
                  langs = cfg.get("languages", {}) or {}
                  for l in app_langs:
                      if (langs.get(l) or {}).get("enabled"):
                          chosen.append(l)
                  pfx = (((cfg.get("ci") or {}).get("sarif") or {}).get("category_prefix"))
                  if pfx:
                      prefix = pfx
              except Exception as exc:
                  raise RuntimeError("Cannot read trusted language policy") from exc
          out = os.environ["GITHUB_OUTPUT"]
          with open(out, "a") as f:
              f.write(f"languages={json.dumps(chosen)}\n")
              f.write(f"category_prefix={prefix}\n")
          print(f"languages={chosen} category_prefix={prefix}")
          PY

  # ==========================================================================
  # SEMGREP — one job per language => DISTINCT SARIF category per tool
  # ==========================================================================
  semgrep:
    name: Semgrep (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: detect
    if: needs.detect.outputs.languages != '[]' && needs.detect.outputs.languages != ''
    permissions:
      contents: read
      actions: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: ${{ fromJSON(needs.detect.outputs.languages) }}
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          fetch-depth: 0

      - name: Download workflow policy helper
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: ${{ needs.detect.outputs.policy-helper-artifact }}
          path: ${{ runner.temp }}/app-policy-helper

      - name: Apply trusted scanner policy
        env:
          TRUSTED_POLICY_SHA: ${{ github.event.pull_request.base.sha || github.sha }}
        run: python3 "${RUNNER_TEMP}/app-policy-helper/prepare_scan_policy.py"

      - name: Select policy Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: '3.11'

      - name: Install Semgrep (pinned)
        # github/inputs context goes through env vars (never interpolated into the
        # shell directly) — see docs/SECURITY-MODEL.md. This is the pattern consumers
        # should copy.
        env:
          SEMGREP_VERSION: ${{ inputs.semgrep-version }}
        run: |
          python3 -I -m pip install --quiet "semgrep==${SEMGREP_VERSION}"
          semgrep --version

      - name: Map language to ruleset
        id: ruleset
        env:
          LANGUAGE: ${{ matrix.language }}
        run: |
          case "${LANGUAGE}" in
            csharp)     echo "config=p/csharp" >> "$GITHUB_OUTPUT" ;;
            typescript) echo "config=p/typescript" >> "$GITHUB_OUTPUT" ;;
            *)          echo "config=auto" >> "$GITHUB_OUTPUT" ;;
          esac

      - name: Run Semgrep -> SARIF
        env:
          PYTHONUTF8: "1"
          SEMGREP_SEND_METRICS: "off"
          SG_CONFIG: ${{ steps.ruleset.outputs.config }}
          SG_SEVERITY: ${{ inputs.severity }}
          SG_LANG: ${{ matrix.language }}
        run: |
          out="semgrep-${SG_LANG}.sarif"
          semgrep scan \
            --config "${SG_CONFIG}" \
            --severity "${SG_SEVERITY}" \
            --sarif --output "${out}" \
            --disable-nosem --metrics off --quiet -- .
          test -s "${out}"

      - name: Upload SARIF (distinct category)
        if: always() && inputs.upload-sarif
        uses: github/codeql-action/upload-sarif@b5ebac6f4c00c8ccddb7cdcd45fdb248329f808a  # v3.32.2
        with:
          sarif_file: semgrep-${{ matrix.language }}.sarif
          category: ${{ needs.detect.outputs.category_prefix }}semgrep-${{ matrix.language }}
        continue-on-error: true

      - name: Gate on findings
        if: inputs.fail-on-findings
        env:
          PYTHONUTF8: "1"
          SEMGREP_SEND_METRICS: "off"
          SG_CONFIG: ${{ steps.ruleset.outputs.config }}
          SG_SEVERITY: ${{ inputs.severity }}
        run: |
          semgrep scan \
            --config "${SG_CONFIG}" \
            --severity "${SG_SEVERITY}" \
            --disable-nosem --error --metrics off --quiet -- .

  # ==========================================================================
  # SECRETS — Trivy secret scan over the tree => distinct category
  # ==========================================================================
  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: detect
    if: inputs.run-secret-scan
    permissions:
      contents: read
      actions: read
      security-events: write
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          fetch-depth: 0

      - name: Download workflow policy helper
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: ${{ needs.detect.outputs.policy-helper-artifact }}
          path: ${{ runner.temp }}/app-policy-helper

      - name: Apply trusted scanner policy
        env:
          TRUSTED_POLICY_SHA: ${{ github.event.pull_request.base.sha || github.sha }}
        run: python3 "${RUNNER_TEMP}/app-policy-helper/prepare_scan_policy.py"

      - name: Install Trivy
        # Download the pinned release from GitHub and verify its checksum. The install
        # script behind setup-trivy fetches from get.trivy.dev, which no longer resolves.
        env:
          TRIVY_VERSION: "0.75.0"
          TRIVY_SHA256: "c6e65abddb348e25f10549df887045629cf28cc72453cd1c63acb717316b3f3f"
        run: |
          set -euo pipefail
          archive="trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz"
          curl -fsSL --retry 3 -o "${RUNNER_TEMP}/${archive}"             "https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}/${archive}"
          echo "${TRIVY_SHA256}  ${RUNNER_TEMP}/${archive}" | sha256sum -c -
          mkdir -p "${RUNNER_TEMP}/trivy-bin"
          tar -xzf "${RUNNER_TEMP}/${archive}" -C "${RUNNER_TEMP}/trivy-bin" trivy
          echo "${RUNNER_TEMP}/trivy-bin" >> "${GITHUB_PATH}"

      - name: Trivy secret scan -> SARIF
        run: |
          trivy fs . --scanners secret --severity CRITICAL,HIGH --exit-code 0 \
            --format sarif --output trivy-secrets.sarif \
            --skip-dirs "node_modules,dist,build,bin,obj,.terraform" --quiet

      - name: Upload secrets SARIF (distinct category)
        if: always() && inputs.upload-sarif
        uses: github/codeql-action/upload-sarif@b5ebac6f4c00c8ccddb7cdcd45fdb248329f808a  # v3.32.2
        with:
          sarif_file: trivy-secrets.sarif
          category: ${{ needs.detect.outputs.category_prefix }}trivy-secrets
        continue-on-error: true

      - name: Gate on secret findings
        if: inputs.fail-on-findings
        run: |
          trivy fs . --scanners secret --severity CRITICAL,HIGH --exit-code 1 \
            --format table \
            --skip-dirs "node_modules,dist,build,bin,obj,.terraform" --quiet
