# ============================================================================
# REUSABLE SECURITY SCANNING WORKFLOW
# auto-code-scanning
#
# Reusable workflow for consuming repos. Called via workflow_call trigger.
# Runs Trivy, Checkov, and tflint scans with SARIF upload and PR comments.
#
# Usage in consuming repo:
#   jobs:
#     security-scan:
#       uses: {org}/auto-code-scanning/.github/workflows/reusable-scan.yml@<release tag>
#       with:
#         terraform-directory: "terraform/"
#         cloud-provider: "aws"
#       permissions:
#         contents: read
#         security-events: write
#         pull-requests: write
# ============================================================================

name: Reusable Security Scan

on:
  workflow_call:
    inputs:
      terraform-directory:
        description: "Root directory containing Terraform files"
        type: string
        required: false
        default: "."
      cloud-provider:
        description: "Cloud provider: aws, azure, or gcp"
        type: string
        required: true
      severity:
        description: "Comma-separated severity filter (default per FR-024: CRITICAL,HIGH)"
        type: string
        required: false
        default: "CRITICAL,HIGH"
      scanning-repository:
        description: "Reviewed platform repository or an explicit trusted mirror"
        type: string
        required: false
        default: "agenticcodingops/auto-code-scanning"
      scanning-repo-ref:
        description: "Git ref for the scanning repo checkout (tag, branch, or SHA)"
        type: string
        required: false
        default: "v2.3.6"  # x-release-please-version
      fail-on-findings:
        description: "Whether findings cause workflow failure"
        type: boolean
        required: false
        default: true
      upload-sarif:
        description: "Upload SARIF to GitHub Code Scanning"
        type: boolean
        required: false
        default: true
      allow-sarif-upload-errors:
        description: "Explicitly tolerate optional code-scanning delivery errors; scanner health remains mandatory"
        type: boolean
        required: false
        default: false
      post-pr-comment:
        description: "Post findings summary as PR comment"
        type: boolean
        required: false
        default: true
      apply-suppressions:
        description: "Apply .scan-suppressions.yaml filtering"
        type: boolean
        required: false
        default: true
      checkov-skip-checks:
        description: "Comma-separated Checkov IDs to skip, with no spaces; merged with the cloud config"
        type: string
        required: false
        default: ""
      checkov-render-iter-count:
        description: "Positive integer override for Checkov variable render iterations; empty keeps its default"
        type: string
        required: false
        default: ""
      apply-baseline:
        description: "Filter baseline findings"
        type: boolean
        required: false
        default: true
      allow-legacy-exceptions:
        description: "Explicit migration opt-in for schema 1.0 broad exceptions"
        type: boolean
        required: false
        default: false
      allow-inline-checkov-skips:
        description: "Explicitly honor source inline Checkov skips (trusted callers only)"
        type: boolean
        required: false
        default: false
      enable-snyk:
        description: "Enable optional Snyk IaC scan (requires SNYK_TOKEN secret)"
        type: boolean
        required: false
        default: false
      upload-metrics:
        description: "Upload metrics as artifact"
        type: boolean
        required: false
        default: true
    outputs:
      findings-count:
        description: "Total findings after filtering"
        value: ${{ jobs.aggregate.outputs.findings-count }}
      critical-count:
        description: "CRITICAL findings count"
        value: ${{ jobs.aggregate.outputs.critical-count }}
      high-count:
        description: "HIGH findings count"
        value: ${{ jobs.aggregate.outputs.high-count }}
      scan-passed:
        description: "true or false"
        value: ${{ jobs.aggregate.outputs.scan-passed }}
      sarif-uploaded:
        description: "true or false"
        value: ${{ jobs.sarif-upload.outputs.sarif-uploaded }}
    secrets:
      SNYK_TOKEN:
        description: "Snyk API token for IaC scanning (optional)"
        required: false

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ==========================================================================
  # SETUP
  # Install tools, download configs
  # ==========================================================================
  setup:
    name: Setup Scanning Tools
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      config-path: ${{ steps.config.outputs.config-path }}
      checkov-skip-checks: ${{ steps.checkov-options.outputs.skip-checks }}
      checkov-render-env: ${{ steps.checkov-options.outputs.render-env }}
    steps:
      - name: Checkout scanning repo configs
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          repository: ${{ inputs.scanning-repository }}
          ref: ${{ inputs.scanning-repo-ref }}
          path: .scanning-repo
          sparse-checkout: |
            configs/${{ inputs.cloud-provider }}
            configs/common
            scripts

      - name: Copy configs to .scanning/configs
        id: config
        env:
          # Bind the untrusted input to an env var so it is never interpolated into the
          # shell command text (avoids GitHub Actions script injection).
          CLOUD_PROVIDER: ${{ inputs.cloud-provider }}
        run: |
          mkdir -p .scanning/configs
          cp ".scanning-repo/configs/${CLOUD_PROVIDER}/.checkov.yaml" .scanning/configs/.checkov.yaml
          cp ".scanning-repo/configs/${CLOUD_PROVIDER}/.tflint.hcl" .scanning/configs/.tflint.hcl
          cp ".scanning-repo/configs/${CLOUD_PROVIDER}/policy-overlay.yaml" .scanning/configs/policy-overlay.yaml 2>/dev/null || true
          cp .scanning-repo/configs/common/.trivyignore .scanning/configs/.trivyignore 2>/dev/null || true
          cp .scanning-repo/scripts/checkov-consumer-options.py .scanning/configs/checkov-consumer-options.py
          cp .scanning-repo/scripts/prepare_scan_policy.py .scanning/configs/prepare_scan_policy.py
          for helper in aggregate_scan.py scan_policy.py scan_reports.py validate-suppressions.py; do
            cp -- ".scanning-repo/scripts/$helper" ".scanning/configs/$helper"
          done
          echo "config-path=.scanning/configs" >> "$GITHUB_OUTPUT"

      - name: Select policy Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: '3.11'

      - name: Install YAML reader
        run: python3 -I -m pip install --disable-pip-version-check PyYAML==6.0.3

      - name: Validate Checkov consumer settings
        id: checkov-options
        env:
          CHECKOV_SKIP_CHECKS: ${{ inputs.checkov-skip-checks }}
          CHECKOV_RENDER_ITER_COUNT: ${{ inputs.checkov-render-iter-count }}
        run: python3 .scanning/configs/checkov-consumer-options.py prepare .scanning/configs/.checkov.yaml

      - name: Upload config artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: scanning-configs
          path: .scanning/configs/
          # The configs are dotfiles (.tflint.hcl, .checkov.yaml, .trivyignore); upload-artifact@v4
          # excludes hidden files by default, which left the tflint job with no config.
          include-hidden-files: true
          retention-days: 1

  # ==========================================================================
  # TRIVY IaC SCAN
  # ==========================================================================
  scan-trivy:
    name: Trivy IaC Scan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: setup
    steps:
      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          fetch-depth: 0

      - name: Prepare tooling directory
        run: |
          rm -rf -- .scan-tooling
          mkdir -- .scan-tooling

      - name: Download configs
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4.3.0
        with:
          name: scanning-configs
          path: .scan-tooling/

      - name: Clear previous report paths
        run: rm -f -- trivy-iac-results.json trivy-secrets-results.json checkov-results.json snyk-iac-results.json tflint-results.json tflint-dir-*.json

      - name: Apply trusted scanner policy
        env:
          TRUSTED_POLICY_SHA: ${{ github.event.pull_request.base.sha || github.sha }}
        run: python3 "${GITHUB_WORKSPACE}/.scan-tooling/prepare_scan_policy.py"

      - name: Run Trivy IaC scanner
        env:
          TRIVY_INCLUDE_NON_FAILURES: "true"
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25  # v0.36.0
        with:
          version: "v0.75.0"  # exact Trivy pin; bump deliberately (docs/VERSION-PINNING.md)
          scan-type: config
          scan-ref: ${{ inputs.terraform-directory }}
          severity: ${{ inputs.severity }}
          exit-code: "0"
          format: json
          output: trivy-iac-results.json
          trivyignores: .scan-tooling/.trivyignore
          skip-dirs: ".terraform,node_modules,.git"

      - name: Show Trivy version
        # Records the binary version and the digest of the checks bundle Trivy downloaded,
        # in the log and in the job summary.
        run: |
          trivy --version --cache-dir "${GITHUB_WORKSPACE}/.cache/trivy" > "${RUNNER_TEMP}/trivy-version.txt"
          cat "${RUNNER_TEMP}/trivy-version.txt"
          {
            echo "### Trivy"
            echo ""
            echo "~~~"
            cat "${RUNNER_TEMP}/trivy-version.txt"
            echo "~~~"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Generate Trivy IaC SARIF
        if: always()
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25  # v0.36.0
        with:
          version: "v0.75.0"  # exact Trivy pin; bump deliberately (docs/VERSION-PINNING.md)
          scan-type: config
          scan-ref: ${{ inputs.terraform-directory }}
          severity: ${{ inputs.severity }}
          exit-code: "0"
          format: sarif
          output: trivy-iac-results.sarif
          trivyignores: .scan-tooling/.trivyignore
          skip-dirs: ".terraform,node_modules,.git"

      - name: Run Trivy secret scanner
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25  # v0.36.0
        with:
          version: "v0.75.0"  # exact Trivy pin; bump deliberately (docs/VERSION-PINNING.md)
          scan-type: fs
          scanners: secret
          severity: "HIGH,CRITICAL"
          exit-code: "0"
          format: json
          output: trivy-secrets-results.json

      - name: Generate Trivy secrets SARIF
        if: always()
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25  # v0.36.0
        with:
          version: "v0.75.0"  # exact Trivy pin; bump deliberately (docs/VERSION-PINNING.md)
          scan-type: fs
          scanners: secret
          severity: "HIGH,CRITICAL"
          exit-code: "0"
          format: sarif
          output: trivy-secrets-results.sarif

      - name: Upload Trivy results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: trivy-results
          path: |
            trivy-iac-results.json
            trivy-iac-results.sarif
            trivy-secrets-results.json
            trivy-secrets-results.sarif
          retention-days: 1

  # ==========================================================================
  # CHECKOV POLICY SCAN
  # ==========================================================================
  scan-checkov:
    name: Checkov Policy Scan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: setup
    steps:
      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          fetch-depth: 0

      - name: Prepare tooling directory
        run: |
          rm -rf -- .scan-tooling
          mkdir -- .scan-tooling

      - name: Download configs
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4.3.0
        with:
          name: scanning-configs
          path: .scan-tooling/

      - name: Clear previous report paths
        run: rm -f -- trivy-iac-results.json trivy-secrets-results.json checkov-results.json snyk-iac-results.json tflint-results.json tflint-dir-*.json

      - name: Apply trusted scanner policy
        env:
          TRUSTED_POLICY_SHA: ${{ github.event.pull_request.base.sha || github.sha }}
        run: python3 "${GITHUB_WORKSPACE}/.scan-tooling/prepare_scan_policy.py"

      - name: Run Checkov
        uses: bridgecrewio/checkov-action@444c9db6fa75e2d9c19ebf1fde7322089be9009e  # v12.3125.0 = Checkov 3.3.19
        # An empty object leaves the variable unset; an empty env value would break
        # Checkov's integer parser. Apply the override to this step only.
        env: ${{ fromJSON(needs.setup.outputs.checkov-render-env) }}
        with:
          directory: ${{ inputs.terraform-directory }}
          config_file: .scan-tooling/.checkov.yaml
          skip_check: ${{ needs.setup.outputs.checkov-skip-checks }}
          framework: terraform
          output_format: cli,json,sarif
          output_file_path: console,checkov-results.json,checkov-results.sarif
          soft_fail: true
          download_external_modules: false

      - name: Generate remediation URLs
        if: always()
        run: |
          if [ -f checkov-results.json ]; then
            python3 -c "
          import json, os, sys

          try:
              with open('checkov-results.json', 'r') as f:
                  data = json.load(f)
          except (json.JSONDecodeError, FileNotFoundError):
              sys.exit(0)

          results = data if isinstance(data, list) else [data]
          for result in results:
              for check_type in ['passed_checks', 'failed_checks']:
                  # Checkov nests the check lists under 'results'.
                  checks = (result.get('results') or {}).get(check_type, [])
                  for check in checks:
                      check_id = check.get('check_id', '')
                      if check_id.startswith('CKV_'):
                          check['guideline'] = f'https://docs.checkov.io/docs/{check_id}'

          # Checkov runs as root in its container, so its report is root-owned and this
          # step cannot open it for writing. Write a new file and rename it over the report.
          with open('checkov-results.json.tmp', 'w') as f:
              json.dump(results if len(results) > 1 else results[0], f, indent=2)
          os.replace('checkov-results.json.tmp', 'checkov-results.json')
          "
          fi

      - name: Remove skipped results from the Checkov artifact
        id: filter-checkov-artifact
        env:
          ALLOW_INLINE_CHECKOV_SKIPS: ${{ inputs.allow-inline-checkov-skips }}
        if: always()
        run: |
          if [ -f checkov-results.sarif ]; then
            python3 "${GITHUB_WORKSPACE}/.scan-tooling/checkov-consumer-options.py" filter-sarif checkov-results.sarif
          fi

      - name: Upload Checkov results
        if: always() && steps.filter-checkov-artifact.outcome == 'success'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: checkov-results
          path: |
            checkov-results.json
            checkov-results.sarif
          retention-days: 1

  # ==========================================================================
  # TFLINT SCAN
  # ==========================================================================
  scan-tflint:
    name: TFLint Scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: setup
    steps:
      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          fetch-depth: 0

      - name: Prepare tooling directory
        run: |
          rm -rf -- .scan-tooling
          mkdir -- .scan-tooling

      - name: Download configs
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4.3.0
        with:
          name: scanning-configs
          path: .scan-tooling/

      - name: Clear previous report paths
        run: rm -f -- trivy-iac-results.json trivy-secrets-results.json checkov-results.json snyk-iac-results.json tflint-results.json tflint-dir-*.json

      - name: Apply trusted scanner policy
        env:
          TRUSTED_POLICY_SHA: ${{ github.event.pull_request.base.sha || github.sha }}
        run: python3 "${GITHUB_WORKSPACE}/.scan-tooling/prepare_scan_policy.py"

      - name: Setup TFLint
        uses: terraform-linters/setup-tflint@90f302c255ef959cbfb4bd10581afecdb7ece3e6  # v4.1.1
        with:
          tflint_version: v0.64.0  # exact pin; bump deliberately (docs/VERSION-PINNING.md)
          # SHA-256 of that release's tflint_linux_amd64.zip and tflint_linux_arm64.zip (its checksums.txt)
          checksums: |
            cca9d13e2e1d7a2c627af60ff899a3c9b74212899416aeb96ec764d2ef954537
            560da89aacf59389d4eb029730dd5b109b7288096c32f2726a0d9e783a5ea8eb

      - name: Initialize TFLint
        # `tflint --init` downloads plugins from the GitHub API, which intermittently
        # returns 5xx (observed 504s) and rate-limits anonymous callers. Authenticate
        # with GITHUB_TOKEN to lift the anonymous limit, and retry up to 3 times with
        # linear backoff so a transient blip isn't a red CI.
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          for attempt in 1 2 3; do
            if tflint --init --config="${GITHUB_WORKSPACE}/.scan-tooling/.tflint.hcl"; then
              break
            fi
            if [ "$attempt" -eq 3 ]; then
              echo "tflint --init failed after 3 attempts" >&2
              exit 1
            fi
            echo "tflint --init attempt ${attempt} failed; retrying in $((attempt * 5))s..." >&2
            sleep "$((attempt * 5))"
          done

      - name: Show TFLint version
        # Prints the TFLint version and the version of each ruleset the config installed,
        # in the log and in the job summary.
        run: |
          tflint --version --config="${GITHUB_WORKSPACE}/.scan-tooling/.tflint.hcl" > "${RUNNER_TEMP}/tflint-version.txt"
          cat "${RUNNER_TEMP}/tflint-version.txt"
          {
            echo "### TFLint and its rulesets"
            echo ""
            echo "~~~"
            cat "${RUNNER_TEMP}/tflint-version.txt"
            echo "~~~"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Run TFLint
        id: tflint
        env:
          # Bind the untrusted input to env (avoids GitHub Actions script injection).
          TERRAFORM_DIRECTORY: ${{ inputs.terraform-directory }}
        run: |
          EXIT_CODE=0
          TFLINT_OUTPUT=""
          SCAN_DIR="$(realpath -- "$TERRAFORM_DIRECTORY")"
          test -d "$SCAN_DIR"
          directories="$(mktemp)"
          find "$SCAN_DIR" -name "*.tf" -type f -printf '%h\0' | sort -zu > "$directories"
          # tflint resolves a relative --config against --chdir, so pass an absolute path.
          TFLINT_CONFIG="${GITHUB_WORKSPACE}/.scan-tooling/.tflint.hcl"

          while IFS= read -r -d '' dir; do
            echo "::group::Scanning $dir"
            report="$(mktemp tflint-dir-XXXXXX.json)"
            status=0
            tflint --config="$TFLINT_CONFIG" --chdir="$dir" --format=json > "$report" || status=$?
            printf '%s' "$dir" > "$report.directory"
            if [ "$status" -ne 0 ] && [ "$status" -ne 2 ]; then EXIT_CODE=1; fi
            echo "::endgroup::"
          done < "$directories"
          rm -f -- "$directories"

          # Merge tflint JSON results
          python3 -c "
          import json, glob, os, sys
          sys.path.insert(0, os.path.join(os.environ['GITHUB_WORKSPACE'], '.scan-tooling'))
          from scan_policy import scanner_path

          def annotate(text):
              # Workflow-command data must escape %, CR and LF.
              return text.replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')

          all_issues = []
          all_errors = []
          # Per-directory reports only: the glob must not also match tflint-results.json.
          for f in glob.glob('tflint-dir-*.json'):
              try:
                  with open(f) as fh:
                      data = json.load(fh)
              except (OSError, ValueError):
                  data = None
              if not isinstance(data, dict) or not isinstance(data.get('issues'), list) or not isinstance(data.get('errors', []), list):
                  # No JSON report: TFLint crashed or stopped before reporting. Record it as
                  # an error so the run cannot pass for a clean one.
                  try:
                      with open(f, errors='replace') as fh:
                          first_line = ''.join(c if c.isprintable() else '?' for c in fh.readline().strip()[:200])
                  except OSError:
                      first_line = ''
                  data = {'errors': [{'message': 'no JSON report: ' + (first_line or 'empty output'), 'severity': 'error'}]}
              all_issues.extend(data.get('issues') or [])
              # TFLint paths are relative to the directory selected by --chdir.
              with open(f + '.directory') as directory_file:
                  directory = directory_file.read()
              for issue in data.get('issues') or []:
                  location = issue.get('range') or {}
                  filename = location.get('filename', '')
                  if filename:
                      issue['reported_file'] = filename
                      location['filename'] = scanner_path(filename, 'tflint', os.environ['GITHUB_WORKSPACE'], directory)
              # Keep TFLint's own errors (e.g. a config it could not load) visible.
              for err in data.get('errors') or []:
                  all_errors.append(err)
                  print('::warning::' + annotate('TFLint error in ' + f + ': ' + str(err.get('message', ''))))

          with open('tflint-results.json', 'w') as f:
              json.dump({'issues': all_issues, 'errors': all_errors}, f, indent=2)
          "
          echo "exit_code=$EXIT_CODE" >> "$GITHUB_OUTPUT"
          exit "$EXIT_CODE"

      - name: Upload TFLint results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: tflint-results
          path: tflint-results.json
          retention-days: 1

  # ==========================================================================
  # SNYK IaC SCAN (OPTIONAL)
  # Only runs when enable-snyk is true and SNYK_TOKEN secret is provided
  # ==========================================================================
  scan-snyk:
    name: Snyk IaC Scan (Optional)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: setup
    if: ${{ inputs.enable-snyk }}
    steps:
      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          fetch-depth: 0

      - name: Prepare tooling directory
        run: |
          rm -rf -- .scan-tooling
          mkdir -- .scan-tooling

      - name: Download configs
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4.3.0
        with:
          name: scanning-configs
          path: .scan-tooling/

      - name: Clear previous report paths
        run: rm -f -- trivy-iac-results.json trivy-secrets-results.json checkov-results.json snyk-iac-results.json tflint-results.json tflint-dir-*.json

      - name: Apply trusted scanner policy
        env:
          TRUSTED_POLICY_SHA: ${{ github.event.pull_request.base.sha || github.sha }}
        run: python3 "${GITHUB_WORKSPACE}/.scan-tooling/prepare_scan_policy.py"

      - name: Setup Node.js
        uses: actions/setup-node@cdca7365b2dadb8aad0a33bc7601856ffabcc48e  # v4.3.0
        with:
          node-version: '20'

      - name: Install Snyk CLI
        run: npm install -g snyk@1.1307.4

      - name: Run Snyk IaC scan
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
          TERRAFORM_DIRECTORY: ${{ inputs.terraform-directory }}
        run: |
          status=0
          policy=()
          if [ -f "$GITHUB_WORKSPACE/.snyk" ]; then policy+=(--policy-path="$GITHUB_WORKSPACE"); fi
          cd -- "$TERRAFORM_DIRECTORY"
          snyk iac test --json \
            --json-file-output="$GITHUB_WORKSPACE/snyk-iac-results.json" \
            --severity-threshold=low "${policy[@]}" || status=$?
          test "$status" -le 1

      - name: Generate Snyk SARIF
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
          TERRAFORM_DIRECTORY: ${{ inputs.terraform-directory }}
        run: |
          status=0
          policy=()
          if [ -f "$GITHUB_WORKSPACE/.snyk" ]; then policy+=(--policy-path="$GITHUB_WORKSPACE"); fi
          cd -- "$TERRAFORM_DIRECTORY"
          snyk iac test \
            --sarif-file-output="$GITHUB_WORKSPACE/snyk-iac-results.sarif" \
            --severity-threshold=low "${policy[@]}" || status=$?
          test "$status" -le 1

      - name: Upload Snyk results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: snyk-results
          path: |
            snyk-iac-results.json
            snyk-iac-results.sarif
          retention-days: 1

  # ==========================================================================
  # AGGREGATE
  # Merge results, deduplicate, apply suppressions/baseline
  # ==========================================================================
  aggregate:
    name: Aggregate Results
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [setup, scan-trivy, scan-checkov, scan-tflint, scan-snyk]
    if: always()
    outputs:
      findings-count: ${{ steps.aggregate.outputs.findings-count }}
      critical-count: ${{ steps.aggregate.outputs.critical-count }}
      high-count: ${{ steps.aggregate.outputs.high-count }}
      scan-passed: ${{ steps.aggregate.outputs.scan-passed }}
    steps:
      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          fetch-depth: 0

      - name: Checkout trusted base policy
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          ref: ${{ github.event.pull_request.base.sha || github.sha }}
          path: .scan-policy
          persist-credentials: false

      - name: Select policy Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: '3.11'

      - name: Install policy reader
        run: python3 -I -m pip install --disable-pip-version-check PyYAML==6.0.3

      - name: Download all results
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4.3.0
        with:
          path: ${{ runner.temp }}/scan-artifacts/

      - name: Aggregate and filter results
        id: aggregate
        env:
          # Untrusted inputs bound to env (avoid GitHub Actions script injection);
          # the python heredoc below reads them via os.environ.
          APPLY_SUPPRESSIONS: ${{ inputs.apply-suppressions }}
          APPLY_BASELINE: ${{ inputs.apply-baseline }}
          FAIL_ON_FINDINGS: ${{ inputs.fail-on-findings }}
          SCANNER_RESULTS: ${{ toJSON(needs) }}
          ENABLE_SNYK: ${{ inputs.enable-snyk }}
          ALLOW_LEGACY_EXCEPTIONS: ${{ inputs.allow-legacy-exceptions }}
          ALLOW_INLINE_CHECKOV_SKIPS: ${{ inputs.allow-inline-checkov-skips }}
          POLICY_ROOT: .scan-policy
          ARTIFACT_ROOT: ${{ runner.temp }}/scan-artifacts
          TERRAFORM_DIRECTORY: ${{ inputs.terraform-directory }}
        run: |
          python3 "${RUNNER_TEMP}/scan-artifacts/scanning-configs/aggregate_scan.py"

      - name: Upload aggregated results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: aggregated-results
          path: .scan-results/aggregated.json
          retention-days: 1

  # ==========================================================================
  # SARIF UPLOAD
  # Upload SARIF to GitHub Code Scanning (with truncation)
  # ==========================================================================
  sarif-upload:
    name: Upload SARIF
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      security-events: write
    needs: [scan-trivy, scan-checkov, scan-snyk, aggregate]
    if: always() && inputs.upload-sarif
    outputs:
      sarif-uploaded: ${{ steps.set-output.outputs.sarif-uploaded }}
    steps:
      - name: Download scan results
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4.3.0
        with:
          path: scan-artifacts/

      - name: Remove suppressed Checkov SARIF results
        id: filter-checkov
        env:
          ALLOW_INLINE_CHECKOV_SKIPS: ${{ inputs.allow-inline-checkov-skips }}
        run: |
          if [ -f scan-artifacts/checkov-results/checkov-results.sarif ]; then
            python3 scan-artifacts/scanning-configs/checkov-consumer-options.py filter-sarif \
              scan-artifacts/checkov-results/checkov-results.sarif
          fi

      - name: Truncate SARIF if needed
        id: truncate
        run: |
          python3 << 'PYTHON_SCRIPT'
          import json
          import os

          MAX_SIZE_BYTES = 25 * 1024 * 1024  # 25MB
          MAX_RESULTS = 5000
          SEVERITY_ORDER = {"critical": 0, "error": 1, "warning": 2, "note": 3, "none": 4}

          for sarif_file in [
              "scan-artifacts/trivy-results/trivy-iac-results.sarif",
              "scan-artifacts/trivy-results/trivy-secrets-results.sarif",
              "scan-artifacts/checkov-results/checkov-results.sarif",
              "scan-artifacts/snyk-results/snyk-iac-results.sarif"
          ]:
              if not os.path.exists(sarif_file):
                  continue

              try:
                  with open(sarif_file) as f:
                      sarif = json.load(f)
              except (json.JSONDecodeError, FileNotFoundError):
                  continue

              total_results = 0
              for run in sarif.get("runs", []):
                  total_results += len(run.get("results", []))

              file_size = os.path.getsize(sarif_file)

              if file_size <= MAX_SIZE_BYTES and total_results <= MAX_RESULTS:
                  continue

              # Truncate: sort by severity, keep top MAX_RESULTS
              for run in sarif.get("runs", []):
                  results = run.get("results", [])
                  results.sort(key=lambda r: SEVERITY_ORDER.get(r.get("level", "none"), 4))
                  shown = min(len(results), MAX_RESULTS)
                  run["results"] = results[:shown]

                  # Add truncation warning
                  run["results"].append({
                      "ruleId": "scan-truncation-warning",
                      "level": "warning",
                      "message": {
                          "text": f"Scan results truncated: {total_results} findings found, showing top {shown} by severity. Run locally for full results."
                      },
                      "locations": []
                  })

              with open(sarif_file, "w") as f:
                  json.dump(sarif, f, indent=2)
              print(f"Truncated {sarif_file}: {total_results} -> {shown} results")
          PYTHON_SCRIPT

      - name: Upload Trivy IaC SARIF
        id: upload-trivy-iac
        continue-on-error: ${{ inputs.allow-sarif-upload-errors }}
        if: always() && hashFiles('scan-artifacts/trivy-results/trivy-iac-results.sarif') != ''
        uses: github/codeql-action/upload-sarif@b5ebac6f4c00c8ccddb7cdcd45fdb248329f808a  # v3.32.2
        with:
          sarif_file: scan-artifacts/trivy-results/trivy-iac-results.sarif
          category: trivy-iac

      - name: Upload Trivy Secrets SARIF
        id: upload-trivy-secrets
        continue-on-error: ${{ inputs.allow-sarif-upload-errors }}
        if: always() && hashFiles('scan-artifacts/trivy-results/trivy-secrets-results.sarif') != ''
        uses: github/codeql-action/upload-sarif@b5ebac6f4c00c8ccddb7cdcd45fdb248329f808a  # v3.32.2
        with:
          sarif_file: scan-artifacts/trivy-results/trivy-secrets-results.sarif
          category: trivy-secrets

      - name: Upload Checkov SARIF
        id: upload-checkov
        continue-on-error: ${{ inputs.allow-sarif-upload-errors }}
        # Never upload raw results after a filter error, even though other uploads
        # use always() to report scanner failures.
        if: always() && steps.filter-checkov.outcome == 'success'
        uses: github/codeql-action/upload-sarif@b5ebac6f4c00c8ccddb7cdcd45fdb248329f808a  # v3.32.2
        with:
          sarif_file: scan-artifacts/checkov-results/checkov-results.sarif
          category: checkov

      - name: Upload Snyk IaC SARIF
        id: upload-snyk
        continue-on-error: ${{ inputs.allow-sarif-upload-errors }}
        if: always() && hashFiles('scan-artifacts/snyk-results/snyk-iac-results.sarif') != ''
        uses: github/codeql-action/upload-sarif@b5ebac6f4c00c8ccddb7cdcd45fdb248329f808a  # v3.32.2
        with:
          sarif_file: scan-artifacts/snyk-results/snyk-iac-results.sarif
          category: snyk-iac

      - name: Set upload output
        id: set-output
        if: always()
        run: |
          if [[ "${{ steps.upload-trivy-iac.outcome }}" == "success" ]] || \
             [[ "${{ steps.upload-trivy-secrets.outcome }}" == "success" ]] || \
             [[ "${{ steps.upload-checkov.outcome }}" == "success" ]] || \
             [[ "${{ steps.upload-snyk.outcome }}" == "success" ]]; then
            echo "sarif-uploaded=true" >> $GITHUB_OUTPUT
          else
            echo "sarif-uploaded=false" >> $GITHUB_OUTPUT
          fi

  # ==========================================================================
  # PR COMMENT
  # Post findings summary as PR comment (always new comment)
  # ==========================================================================
  pr-comment:
    name: PR Comment
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: write
    needs: aggregate
    if: always() && inputs.post-pr-comment && github.event_name == 'pull_request'
    steps:
      - name: Download aggregated results
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4.3.0
        with:
          name: aggregated-results
          path: aggregated/

      - name: Post PR comment
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b  # v7.1.0
        with:
          script: |
            const fs = require('fs');
            let data = {};
            try {
              data = JSON.parse(fs.readFileSync('aggregated/aggregated.json', 'utf8'));
            } catch (e) {
              data = { total_findings: 0, by_severity: {}, suppressions_applied: 0, baseline_filtered: 0, findings: [] };
            }

            const sev = data.by_severity || {};
            const critical = sev.CRITICAL || 0;
            const high = sev.HIGH || 0;
            const medium = sev.MEDIUM || 0;
            const low = sev.LOW || 0;
            const total = data.total_findings || 0;
            const suppressed = data.suppressions_applied || 0;
            const baselined = data.baseline_filtered || 0;
            const complete = data.scan_complete === true;
            const passed = complete && data.scan_passed === true;
            const statusMessage = !complete ? '**Scan incomplete.** Required scanner reports are unavailable or unhealthy.'
              : passed ? 'Scan gate passed.' : `**${total} security findings detected.** Please review.`;

            // Build top findings table (max 20)
            const activeFindings = (data.findings || [])
              .filter(f => !f.suppressed && !f.baseline)
              .sort((a, b) => {
                const order = { CRITICAL: 0, HIGH: 1, MEDIUM: 2, LOW: 3 };
                return (order[a.severity] ?? 4) - (order[b.severity] ?? 4);
              })
              .slice(0, 20);

            let findingsTable = '';
            if (activeFindings.length > 0) {
              findingsTable = '| File | Rule | Severity | Tool | Remediation |\n';
              findingsTable += '|------|------|----------|------|-------------|\n';
              for (const f of activeFindings) {
                const remediation = f.remediation_url ? `[Link](${f.remediation_url})` : 'N/A';
                findingsTable += `| ${f.file} | ${f.rule_id} | ${f.severity} | ${f.tool} | ${remediation} |\n`;
              }
            }

            const statusIcon = passed ? ':white_check_mark:' : ':x:';
            const body = `## Security Scan Results

            | Severity | Count |
            |----------|-------|
            | CRITICAL | ${critical} |
            | HIGH     | ${high} |
            | MEDIUM   | ${medium} |
            | LOW      | ${low} |

            **Tools**: Trivy, Checkov, tflint
            **Suppressions applied**: ${suppressed}
            **Baseline filtered**: ${baselined}

            ${total > 0 ? `<details>
            <summary>Top findings (click to expand)</summary>

            ${findingsTable}

            </details>` : ''}

            ${statusIcon} ${statusMessage}
            `.replace(/^            /gm, '');

            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: body
            });

  # ==========================================================================
  # METRICS
  # Upload metrics artifact
  # ==========================================================================
  metrics:
    name: Upload Metrics
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: aggregate
    if: always() && inputs.upload-metrics
    steps:
      - name: Download aggregated results
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4.3.0
        with:
          name: aggregated-results
          path: aggregated/

      - name: Generate metrics
        env:
          CLOUD_PROVIDER: ${{ inputs.cloud-provider }}
        run: |
          python3 << 'PYTHON_SCRIPT'
          import json
          import os
          from datetime import datetime, timezone

          data = {}
          try:
              with open("aggregated/aggregated.json") as f:
                  data = json.load(f)
          except (json.JSONDecodeError, FileNotFoundError):
              pass

          metrics = {
              "schema_version": "1.0",
              "timestamp": datetime.now(timezone.utc).isoformat(),
              "repository": os.environ.get("GITHUB_REPOSITORY", ""),
              "branch": os.environ.get("GITHUB_HEAD_REF", os.environ.get("GITHUB_REF_NAME", "")),
              "commit_sha": os.environ.get("GITHUB_SHA", ""),
              "cloud_provider": os.environ.get("CLOUD_PROVIDER", ""),
              "aggregate": {
                  "total_findings": data.get("total_findings", 0),
                  "by_severity": data.get("by_severity", {}),
                  "suppressed_count": data.get("suppressions_applied", 0),
                  "baselined_count": data.get("baseline_filtered", 0)
              }
          }

          os.makedirs(".scan-results/metrics", exist_ok=True)
          date_str = datetime.now(timezone.utc).strftime("%Y-%m-%d")
          with open(f".scan-results/metrics/scan-metrics.json", "w") as f:
              json.dump(metrics, f, indent=2)
          PYTHON_SCRIPT

      - name: Upload metrics artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: scan-metrics-${{ inputs.cloud-provider }}-${{ github.run_id }}
          path: .scan-results/metrics/scan-metrics.json
          retention-days: 90
