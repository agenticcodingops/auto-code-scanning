name: Claude Code Review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]
    # Optional: Only run on specific file changes
    # paths:
    #   - "src/**/*.ts"
    #   - "src/**/*.tsx"
    #   - "src/**/*.js"
    #   - "src/**/*.jsx"

jobs:
  claude-review:
    # Skip PRs a bot opened: the release App's release PRs and dependency updates. The action
    # refuses a non-human actor, so without this every such PR shows a failed check.
    # A bot's push to a PR (a worker's fix commit) also starts this job, and the action then fails red on a
    # non-human actor. Skip those runs too (the sender check); a human push still runs it.
    if: github.event.pull_request.user.type != 'Bot' && github.event.sender.type != 'Bot'
    # One run per PR at a time, so a push during a review cannot start a second review before
    # the first has posted. The later run waits, then the plugin sees the review and stops.
    # Not cancel-in-progress: cancelling could cut a review off part-way through posting.
    concurrency:
      group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
      cancel-in-progress: false

    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write # post the review: a summary comment or inline comments
      issues: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          fetch-depth: 1
          # The review reads files in this checkout, and the job token can write to PRs, so
          # keep the token out of .git/config. The action sets up its own git auth.
          persist-credentials: false

      # The summary's body file has a fixed path (see claude_args). Remove anything the PR put
      # there, such as a symlink to .git/config, so the review always writes the file itself.
      - name: Clear the review summary path
        run: rm -rf -- "$GITHUB_WORKSPACE/.review-summary.md"

      # The checkout is the PR's head, and the review must treat it as data. Two things in it could act as
      # more than data while the job's tokens are in the environment, so they are removed before the review starts:
      # - Links. A link can lead out of the checkout or into .git, and a search that walks a directory does not
      #   pass each file it opens to the guard. The guard checks every path it is given as well.
      # - The CLI's project configuration: every .claude directory and .mcp.json file. --setting-sources user
      #   keeps the project settings file out, but agents, skills and commands defined there can carry hooks
      #   and tool grants of their own, and .mcp.json starts servers. None of that may come from the PR.
      # The review still sees these files in the diff. .git is left alone: the action needs it.
      - name: Remove links and agent configuration from the checkout
        run: |
          find "$GITHUB_WORKSPACE" -path "$GITHUB_WORKSPACE/.git" -prune -o -type l -exec rm -f -- {} +
          find "$GITHUB_WORKSPACE" -path "$GITHUB_WORKSPACE/.git" -prune -o \( -name .claude -o -name .mcp.json \) -prune -exec rm -rf -- {} +
          left="$(find "$GITHUB_WORKSPACE" -path "$GITHUB_WORKSPACE/.git" -prune -o \( -type l -o -name .claude -o -name .mcp.json \) -print -quit)"
          if [ -n "$left" ]; then
            echo "::error::the checkout still holds a link or agent configuration: $left"
            exit 1
          fi

      # The plugin's frontmatter grants `Bash(gh pr comment:*)`, with any arguments, and the CLI
      # honours that grant in a non-interactive run: measured on 2.1.281, 2.1.302, 2.1.310, 2.1.314
      # and 2.1.316, with this job's --allowedTools and --disallowedTools in force, and a control
      # command without the grant was denied each time. So the exact-PR, exact-file rules in
      # claude_args do not bind that command: injected PR text could post on another PR, or post
      # `--body-file .git/config`. A deny rule cannot narrow a grant, so this hook does. It runs
      # before every tool call (matcher `*`): the shell tools other than Bash, such as Monitor,
      # reach a hook under a name that depends on the CLI version (measured: "Monitor" on 2.1.302,
      # "Bash" on 2.1.316), and a tool added later would not be on any list. It is an allow-list,
      # not a keyword match, so no spelling of a command and no unlisted tool can get around it.
      # A shell command (Bash, Monitor or PowerShell) passes only if it is byte-for-byte one of
      # the three `gh pr comment` forms claude_args names, or a single `gh pr view|diff|list`,
      # `gh issue view|list` or `gh search <kind>` call whose words contain nothing the shell
      # would expand or split, and no --jq, --template, -q or -t. A file write passes only for the
      # summary file. A read (Read, Grep, Glob, LS) passes only if every path it names resolves, links
      # and all, to the checkout outside .git, and its patterns hold no root, ~, .. or .git, so what
      # the review reads, and can quote in what it posts, is the code under review and nothing of the
      # runner's or the job's. The one exception is a Read of a long tool result
      # the CLI saved under ~/.claude/projects/*/tool-results/. Sub-agents, task tracking, the plugin's own
      # review command (the Skill tool, by exact name: 2.1.281 needs it, 2.1.316 does not) and the
      # inline-comment tool pass; every other tool is blocked. Exit 2 blocks, and stderr tells the
      # model why. The hook command adds `|| exit 2`, so a crash or a missing node blocks every
      # call. A hook that times out does not block, so a watchdog armed on the script's first line
      # blocks at 10 seconds, well inside the hook's 30-second timeout. The write rule matters
      # because the guard script and the settings that install it are files: with an unrestricted
      # Write the review could replace them. The hook is no use if a pull request can switch it
      # off. The checkout is the PR's head, and a `.claude/settings.json` in it with
      # `disableAllHooks` stopped a loaded hook (measured on 2.1.316), so claude_args passes
      # `--setting-sources user`, which keeps settings from the checkout out. The hook itself is
      # installed in the user settings, by the `settings` input.
      - name: Write the review comment guard
        run: |
          cat > "$RUNNER_TEMP/review-comment-guard.js" <<'GUARD'
          if (require.main === module) setTimeout(() => finish(2, "the guard timed out."), 10000);

          const fs = require("fs");
          const os = require("os");
          const path = require("path");

          // A word the shell passes through as written: no quote, backslash, #, $, backtick, ; & | < > ( )
          // { } * ? [ ] ~ ! or space in it. A # would start a shell comment and hide the quote that follows.
          const WORD = /[A-Za-z0-9_.\/:=,@%+-]+/;
          // A whole quoted word. Single quotes hold anything but a quote. Double quotes hold nothing the
          // shell would expand or escape. Nothing here can span a line, because decide() rejects them first.
          // \x5c is the backslash, written as an escape so no layer between an editor and this file can halve it.
          const QUOTED = /(?:'[^']*'|"[^"$`\x5c!]*")/;
          const ARG = WORD.source + "|" + QUOTED.source;
          const READ = new RegExp("^gh (?:pr (?:diff|view|list)|issue (?:view|list)|search [a-z]+)(?: (?:" + ARG + "))*$");
          const WORDS = new RegExp("(?<= )(?:" + ARG + ")(?= |$)", "g");
          // gh's --jq and --template can read environment variables, and -q and -t are their short forms.
          const FILTER = /^(?:--(?:jq|template)(?:=|$)|-(?!-)[A-Za-z]*[qt])/;
          const FILE_TOOLS = ["Write", "Edit", "MultiEdit", "NotebookEdit"];
          // Tools that run a shell command. The name a hook is given for them depends on the CLI version: a
          // Monitor call reaches a hook as "Bash" on 2.1.316 and as "Monitor" on 2.1.302, so all are listed.
          const SHELL_TOOLS = ["Bash", "Monitor", "PowerShell"];
          // Tools that read or list files. Every path they are given must lead, after its links are resolved, to the
          // checkout and not into .git (see readTarget). A field that is required here must be present.
          const READ_TOOLS = { Read: ["file_path"], LS: ["path"], Grep: [], Glob: [] };
          // Patterns that select files below the search root: Glob's pattern and Grep's glob filter.
          const READ_PATTERNS = { Glob: ["pattern"], Grep: ["glob"] };
          // Tools that neither run a command, read a file nor write one, and that the review needs: launching
          // sub-agents, tracking tasks, and loading tool schemas.
          // Everything not named in this file is blocked, so a tool added to the CLI later fails closed.
          const NO_IO = ["Agent", "Task", "TaskCreate", "TaskGet", "TaskList", "TaskUpdate",
            "TaskOutput", "TaskStop", "BashOutput", "KillShell", "TodoWrite", "ToolSearch"];
          // Posts one inline comment. The action fixes the repository and pull request, and the body is text.
          const INLINE = "mcp__github_inline_comment__create_inline_comment";
          // The review starts from the plugin's slash command. The CLI expands it up front on 2.1.316, but on 2.1.281
          // the model runs it through the Skill tool, and blocking that makes the model improvise a review without the
          // plugin's steps. A skill's body can carry its own allowed-tools, so only this one command is allowed, by name.
          const PLUGIN_COMMANDS = ["code-review:code-review", "code-review"];

          // Both separators, so a test on Windows reads a path as the runner does. \x5c is the backslash.
          const parts = (p) => p.split(/[\x5c/]+/);
          const inGit = (rel) => parts(rel).some((s) => s.toLowerCase() === ".git");
          function within(child, parent) {
            const rel = path.relative(parent, child);
            return rel === "" || (rel !== ".." && !rel.startsWith(".." + path.sep) && !path.isAbsolute(rel));
          }

          // The real path of p: the longest leading part that exists, with every link in it resolved, followed by
          // the rest as written. Null when a part exists but cannot be resolved, such as a loop of links.
          function realOf(p) {
            const rest = [];
            for (let head = p; ; ) {
              try {
                return path.join(fs.realpathSync.native(head), ...rest);
              } catch (e) {
                if (e.code !== "ENOENT" && e.code !== "ENOTDIR") return null;
                const parent = path.dirname(head);
                if (parent === head) return null;
                rest.unshift(path.basename(head));
                head = parent;
              }
            }
          }

          // The CLI saves a long tool result to a file below its own directory and tells the model to read it. That
          // output came from a tool call the guard already allowed, so a regular file there may be read; nothing else
          // outside the checkout may.
          function savedToolOutput(real) {
            const base = realOf(path.join(process.env.CLAUDE_CONFIG_DIR || path.join(os.homedir(), ".claude"), "projects"));
            if (!real || !base || !within(real, base)) return false;
            const segs = parts(path.relative(base, real));
            if (segs.length < 4 || segs[segs.length - 2] !== "tool-results") return false;
            try {
              return fs.lstatSync(real).isFile();
            } catch (e) {
              return false;
            }
          }

          // Null if a read tool may use this path, or the reason it may not. Resolving the path the way the file
          // system will is the point: an absolute path, a .. segment, a ~ or a link in the checkout that points out
          // of it would otherwise reach the runner's files, and .git holds the job's git credentials. A .. segment
          // is refused outright, because the system applies it after following a link and path.resolve before.
          function readTarget(tool, p, ctx) {
            const refuse = "the review may read only files in the checkout, " + ctx.ws + ", and not in its .git; " +
              JSON.stringify(p) + " is not one (use a path relative to the checkout, with no .. and no links out of it).";
            if (typeof p !== "string" || p === "" || /[\x00-\x1f\x7f]/.test(p)) return refuse;
            if (p.startsWith("~") || parts(p).includes("..")) return refuse;
            const ws = path.resolve(ctx.ws);
            const abs = path.resolve(ws, p);
            const real = realOf(abs);
            const realWs = realOf(ws);
            if (real && realWs && within(abs, ws) && !inGit(path.relative(ws, abs)) &&
                within(real, realWs) && !inGit(path.relative(realWs, real))) {
              return null;
            }
            if (tool === "Read" && savedToolOutput(real)) return null;
            return refuse;
          }

          // Null if a file pattern stays below its search root and out of .git, or the reason it does not. Braces
          // are expanded into alternatives, so an alternative cannot start with a root, a ~ or a drive either.
          function readPattern(p) {
            if (p === undefined) return null;
            const refuse = "the pattern " + JSON.stringify(p) + " must be relative, with no .., no ~ and no .git in it.";
            if (typeof p !== "string" || /[\x00-\x1f\x7f]/.test(p)) return refuse;
            if (p.includes("..") || /(?:^|[{,])\s*(?:[\x5c/~]|[A-Za-z]:)/.test(p)) return refuse;
            if (/\.git(?=$|[\x5c/},)|])/i.test(p)) return refuse;
            return null;
          }

          function decideRead(tool, input, ctx) {
            // The named fields, and any other field whose name says it holds a path, so a field a later CLI adds
            // is checked too.
            const keys = new Set(READ_TOOLS[tool]);
            for (const key of Object.keys(input)) {
              if (/path|file|dir/i.test(key)) keys.add(key);
            }
            for (const key of keys) {
              const value = input[key];
              if (value === undefined && !READ_TOOLS[tool].includes(key)) continue;
              for (const p of Array.isArray(value) ? value : [value]) {
                const why = readTarget(tool, p, ctx);
                if (why) return why;
              }
            }
            for (const key of READ_PATTERNS[tool] || []) {
              const why = readPattern(input[key]);
              if (why) return why;
            }
            return null;
          }

          // Returns null to let the call go on to the normal permission check, or the reason to block it.
          function decide(tool, input, ctx) {
            const file = ctx.ws + "/.review-summary.md";
            if (FILE_TOOLS.includes(tool)) {
              // Every path field that is present must be the summary file, and there must be at least one.
              const targets = [input.file_path, input.notebook_path].filter((p) => p !== undefined);
              const ok = targets.length > 0 && targets.every((p) => typeof p === "string" && path.resolve(p) === path.resolve(file));
              return ok ? null : "the only file the review may write is " + file + ".";
            }
            if (tool === "Skill") {
              return PLUGIN_COMMANDS.includes(input.skill) ? null : "the review may not run the " + String(input.skill) + " skill.";
            }
            if (Object.prototype.hasOwnProperty.call(READ_TOOLS, tool)) return decideRead(tool, input, ctx);
            if (NO_IO.includes(tool) || tool === INLINE) return null;
            if (!SHELL_TOOLS.includes(tool)) return "the review may not use the " + tool + " tool.";

            const command = input.command;
            if (typeof command !== "string") return "a " + tool + " call without a command.";
            const comments = [
              "gh pr comment " + ctx.pr + " --repo " + ctx.repo + " --body-file " + file,
              "gh pr comment " + ctx.pr + " --body-file " + file,
              "gh pr comment https://github.com/" + ctx.repo + "/pull/" + ctx.pr + " --body-file " + file,
            ];
            if (comments.includes(command)) return null;
            // One line, and no control character, so a quoted string cannot hide a second command.
            if (!/[\x00-\x1f\x7f]/.test(command) && READ.test(command)) {
              for (const word of command.match(WORDS) || []) {
                if (FILTER.test(word.replace(/^(['"])(.*)\1$/, "$2"))) {
                  return "gh read calls may not use --jq, --template, -q or -t.";
                }
              }
              return null;
            }
            return "the only shell commands allowed are single gh calls with plain arguments: `gh pr view|diff|list`, " +
              "`gh issue view|list` and `gh search <kind>` (quote a search phrase as a whole word, with no $, backtick, " +
              "backslash or !; no #, pipes, redirects, heredocs, substitutions or line breaks), and the summary comment, " +
              "exactly `" + comments[0] + "`.";
          }

          function finish(code, why) {
            if (why) process.stderr.write("Blocked: " + why + "\n");
            process.exit(code);
          }

          if (require.main === module) {
            const [pr, repo, ws] = process.argv.slice(2);
            if (!/^[0-9]+$/.test(pr || "") || !/^[\w.-]+\/[\w.-]+$/.test(repo || "") || !ws) {
              finish(2, "the guard was started without its arguments.");
            }
            let raw = "";
            process.stdin.setEncoding("utf8");
            process.stdin.on("data", (chunk) => (raw += chunk));
            process.stdin.on("end", () => {
              let event;
              try {
                event = JSON.parse(raw);
              } catch (e) {
                finish(2, "the hook input could not be read.");
              }
              const why = decide(event.tool_name, event.tool_input || {}, { pr, repo, ws });
              if (why) finish(2, why);
              finish(0);
            });
          } else {
            module.exports = { decide };
          }
          GUARD
          node --check "$RUNNER_TEMP/review-comment-guard.js"

      - name: Run Claude Code Review
        id: claude-review
        # Re-measure before bumping this pin, and before loosening the guard step above: the
        # plugin's `gh pr comment` grant is honoured on every CLI version measured, so the
        # PR boundary rests on that guard, not on --allowedTools.
        uses: anthropics/claude-code-action@8cf3482550831fb35a4fc3fbf7ca139cf8028b4c  # v1.0.233
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # The review's sub-agents must run in the foreground. When the plugin starts one
          # in the background, the main agent ends its turn to wait for it, and that ends
          # the run: green, nothing posted. This repository's #12 showed it (issue #9, run
          # 37162508814: 13 turns, nothing posted). In trackroutinely the same action and
          # plugin posted nothing on 3 of 5 runs on 2026-10-04, each with sub-agents in
          # the background; after this setting (trackroutinely#155) 3 of 3 runs posted,
          # every sub-agent completing. The variable turns off background tasks for the
          # whole run, "including the `run_in_background` parameter on Bash and subagent
          # tools, auto-backgrounding" (https://code.claude.com/docs/en/env-vars).
          # It goes through `settings`, not the step's `env:`: at the pinned commit the
          # action's run step passes only the variables it lists. The action merges this
          # into ~/.claude/settings.json before it installs the plugin
          # (base-action/src/setup-claude-code-settings.ts). The POSTING RULES ask for the
          # foreground too, as a second layer.
          # The same input carries the comment guard written above, as a PreToolUse hook on every tool.
          settings: |
            {
              "env": {
                "CLAUDE_CODE_DISABLE_BACKGROUND_TASKS": "1"
              },
              "hooks": {
                "PreToolUse": [
                  {
                    "matcher": "*",
                    "hooks": [
                      {
                        "type": "command",
                        "timeout": 30,
                        "command": "node '${{ runner.temp }}/review-comment-guard.js' ${{ github.event.pull_request.number }} ${{ github.repository }} '${{ github.workspace }}' || exit 2"
                      }
                    ]
                  }
                ]
              }
            }
          # The action's own token is in GH_TOKEN while the review runs, so text in a PR could
          # make the review disclose it (see claude_args). The action asks for contents: write by
          # default; the review never pushes, so ask for read and a leaked token cannot push code.
          additional_permissions: |
            contents: read
          plugin_marketplaces: 'https://github.com/anthropics/claude-code.git'
          plugins: 'code-review@claude-code-plugins'
          # Without --comment the plugin reviews and then posts nothing, by design.
          # The POSTING RULES reach the plugin as arguments. Without them the model reaches for
          # `gh api`, shell reads of saved output and heredoc bodies, which the allow-list denies,
          # so nothing gets posted. A redirect such as `gh pr diff <N> > file` is denied too,
          # because its target is checked as a file write: on one review elsewhere it was 22 of
          # 23 denials. The agents the plugin launches read the diff, so they get that rule too.
          # Folded (>-) into one line, which is how the plugin receives arguments.
          prompt: >-
            /code-review:code-review ${{ github.repository }}/pull/${{ github.event.pull_request.number }} --comment
            POSTING RULES (follow exactly):
            get the full head commit SHA with `gh pr view ${{ github.event.pull_request.number }} --json headRefOid`, never with gh api.
            Read saved tool output with the Read tool, never with shell commands.
            Run `gh pr diff` without redirecting its output into a file, and tell every agent you launch
            to do the same and to read saved tool output with the Read tool.
            Post inline comments only with the mcp__github_inline_comment__create_inline_comment tool, never with gh api.
            To post the summary comment, first write the body to ${{ github.workspace }}/.review-summary.md with the Write tool,
            then run exactly `gh pr comment ${{ github.event.pull_request.number }} --repo ${{ github.repository }} --body-file ${{ github.workspace }}/.review-summary.md`,
            with no other flags and no other file;
            never use redirects, heredocs, pipes or command substitution in gh commands,
            and never use --jq, -q, --template or -t with gh.
            Run every sub-agent in the foreground: if the Agent tool takes run_in_background, pass false,
            and never end your turn while a sub-agent is still running.
          # The plugin's own allowed-tools list plus an Edit rule for the summary file only (an
          # Edit rule covers the Write tool; a Write(path) rule is never matched), so its gh and
          # inline-comment calls are not denied. The denies keep the file tools off the guard
          # script, the settings that install it, and .git. `gh pr comment` is named here by this PR (by
          # number or URL) and one body file, with exact rules and no wildcard. These rules only
          # approve those forms; the plugin's own grant approves every other `gh pr comment`, so
          # the guard step above is what stops one. The reasoning for the exact rules still holds
          # for the guard, which allows the same three forms. The review action
          # puts its own token in this checkout's .git/config and in GH_TOKEN, and only inline
          # comments go through its token redaction, so a prefix rule would let injected PR text
          # post `--body-file .git/config` or `--body-file /proc/self/environ`. The Read deny keeps
          # the file tools out of .git. A trailing wildcard would not bind the file: gh takes the
          # last --body-file it is given. gh's --jq filter can read environment variables, so
          # the gh read commands may not use --jq or --template. This narrows exfiltration but
          # does not stop it: deny rules match the command text, so a crafted command can slip
          # past them, and read-only shell commands can still print the token. That token stays
          # live until the job ends, which is why it is asked for with contents: read.
          claude_args: |
            --allowedTools "Edit(/${{ github.workspace }}/.review-summary.md),mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment ${{ github.event.pull_request.number }} --repo ${{ github.repository }} --body-file ${{ github.workspace }}/.review-summary.md),Bash(gh pr comment ${{ github.event.pull_request.number }} --body-file ${{ github.workspace }}/.review-summary.md),Bash(gh pr comment https://github.com/${{ github.repository }}/pull/${{ github.event.pull_request.number }} --body-file ${{ github.workspace }}/.review-summary.md),Bash(gh pr diff:*),Bash(gh pr view:*),Bash(gh pr list:*),Bash(gh issue view:*),Bash(gh issue list:*),Bash(gh search:*)"
            --disallowedTools "Read(./.git/**),Edit(/${{ runner.temp }}/**),Edit(~/.claude/**),Edit(/${{ github.workspace }}/.git/**),Bash(gh * --jq*),Bash(gh * -q*),Bash(gh * --template*),Bash(gh * -t*)"
            --setting-sources user
          # See https://github.com/anthropics/claude-code-action/blob/main/docs/usage.md
          # or https://code.claude.com/docs/en/cli-reference for available options

