# ============================================================================
# RELEASE
# auto-code-scanning
#
# Runs release-please on every push to main. It keeps one release PR open that
# proposes the next version from the conventional commits merged since the
# last release: the CHANGELOG.md entry, and the new version in
# .release-please-manifest.json, version.txt and the x-release-please-version
# lines of every file listed under extra-files in release-please-config.json.
# Merging that PR makes the next run
# create the vX.Y.Z tag on the merge commit and a GitHub Release with the same
# notes. Publishing the release starts release-verify.yml on the tag.
#
# Token: an installation token of the organization's release GitHub App,
# minted for each run from the RELEASE_APP_CLIENT_ID variable and the
# RELEASE_APP_PRIVATE_KEY secret. It covers this repository only, with
# Contents, Pull requests and Issues write, and is revoked when the job ends
# (docs/CONTRIBUTING.md describes the App and its key rotation). Unlike
# GITHUB_TOKEN, whose PRs, tags and releases start no workflow, it lets CI run
# on the release PR and lets the release start its verification run.
#
# Never create release tags by hand. See "Release Process" in docs/CONTRIBUTING.md.
# ============================================================================

name: Release

on:
  push:
    branches: [main]
  # Regenerates the release PR without re-running an old run.
  workflow_dispatch:

# This block governs only GITHUB_TOKEN, which the job does not use. Every write
# goes through the App's installation token, whose permissions are requested
# where it is minted.
permissions: {}

# One release run at a time, and never cancel one in progress: a cancelled run
# can leave a tag without its release or a release PR half updated. A newer
# queued run replaces an older queued one, which loses nothing because every
# run reads main as it is when it starts.
concurrency:
  group: release-please
  cancel-in-progress: false

jobs:
  release-please:
    name: Release PR and tag
    # A dispatch from another branch would run that branch's copy of this file.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Require the release App's client ID and private key
        env:
          # Booleans, so the private key itself never reaches this step.
          HAS_CLIENT_ID: ${{ vars.RELEASE_APP_CLIENT_ID != '' }}
          HAS_PRIVATE_KEY: ${{ secrets.RELEASE_APP_PRIVATE_KEY != '' }}
        run: |
          if [ "$HAS_CLIENT_ID" != "true" ] || [ "$HAS_PRIVATE_KEY" != "true" ]; then
            echo "::error::The RELEASE_APP_CLIENT_ID variable or the RELEASE_APP_PRIVATE_KEY secret is not available to this repository. See \"Release Process\" in docs/CONTRIBUTING.md."
            exit 1
          fi

      - name: Mint the release token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1  # v3.2.0
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          # No owner or repositories: the token covers this repository only.
          permission-contents: write
          permission-pull-requests: write
          permission-issues: write

      - name: Run release-please
        id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7  # v5.0.0
        with:
          token: ${{ steps.app-token.outputs.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

      - name: Summarise the release
        if: steps.release.outputs.release_created == 'true'
        env:
          # The tag name and commit only; the release notes stay out of the shell.
          TAG_NAME: ${{ steps.release.outputs.tag_name }}
          RELEASE_SHA: ${{ steps.release.outputs.sha }}
        run: |
          {
            echo "### Released ${TAG_NAME}"
            echo ""
            echo "The tag points to commit \`${RELEASE_SHA}\`."
            echo "Its verification run is in the Release Verification workflow, on ref \`${TAG_NAME}\`."
          } >> "$GITHUB_STEP_SUMMARY"
