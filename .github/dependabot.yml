version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Etc/UTC"
    groups:
      actions-patch-and-minor:
        patterns: ["*"]
        update-types: ["patch", "minor"]
    commit-message:
      prefix: "chore(deps)"
    labels: ["dependencies"]
    open-pull-requests-limit: 5
    ignore:
      # P1/P2: bundled CLI needs manual re-measure and coordinated mirrors; docs/VERSION-PINNING.md#existing-bump-preconditions.
      - dependency-name: "anthropics/claude-code-action"
      # P3: choose the embedded Checkov engine deliberately; docs/VERSION-PINNING.md#existing-bump-preconditions.
      - dependency-name: "bridgecrewio/checkov-action"
      # P4: preserve the verified scanner download coordination; docs/VERSION-PINNING.md#existing-bump-preconditions.
      - dependency-name: "aquasecurity/trivy-action"

  - package-ecosystem: "pre-commit"
    directory: "/scripts"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Etc/UTC"
    groups:
      hooks-patch-and-minor:
        patterns: ["*"]
        update-types: ["patch", "minor"]
    commit-message:
      prefix: "chore(deps)"
    labels: ["dependencies"]
    open-pull-requests-limit: 5
    ignore:
      # Release automation owns marked hook revs; docs/VERSION-PINNING.md#release-managed-platform-references.
      - dependency-name: "https://github.com/agenticcodingops/auto-code-scanning"
